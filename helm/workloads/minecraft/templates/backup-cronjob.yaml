apiVersion: batch/v1
kind: CronJob
metadata:
  name: minecraft-world-backup
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  suspend: {{ .Values.backup.suspend }}
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command:
                - /bin/sh
                - -ec
                - |
                  TS=$(date +%Y%m%d-%H%M%S)
                  apk add --no-cache zip curl
                  curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  cd /data
                  zip -r /tmp/world-${TS}.zip world
                  mc alias set local {{ .Values.backup.minioEndpoint }} "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
                  mc cp /tmp/world-${TS}.zip local/{{ .Values.backup.minioBucket }}/
              env:
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.minioSecretName }}
                      key: accessKey
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.minioSecretName }}
                      key: secretKey
              volumeMounts:
                - name: minecraft-data
                  mountPath: /data
          volumes:
            - name: minecraft-data
              persistentVolumeClaim:
                claimName: {{ .Values.backup.pvcName }}
