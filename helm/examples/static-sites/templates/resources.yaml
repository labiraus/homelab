apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: site-{{ .Values.site.name }}
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - {{ .Values.site.host }}
  gateways:
    - {{ .Values.gateway.namespace }}/{{ .Values.gateway.name }}
  http:
    - route:
        - destination:
            host: {{ .Values.minio.serviceName }}.{{ .Values.minio.namespace }}.svc.cluster.local
            port:
              number: {{ .Values.minio.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site-{{ .Values.site.name }}
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.site.host }}
  rules:
    - backendRefs:
        - name: {{ .Values.minio.serviceName }}
          namespace: {{ .Values.minio.namespace }}
          port: {{ .Values.minio.port }}
