{{- if .Values.worldbuilder.enabled }}
{{- $_ := set .Values "env" (merge (dict "WORLDBUILDER_ENABLED" "true") (.Values.env | default dict)) }}
{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets .Values.worldbuilder.databaseSecret) }}
{{- if .Values.worldbuilder.aiSecret }}
{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets .Values.worldbuilder.aiSecret) }}
{{- end }}
{{- if .Values.worldbuilder.mcp.enabled }}
{{- $secret := required "worldbuilder.mcp.delegationSecret is required" .Values.worldbuilder.mcp.delegationSecret }}
{{- $_ := set .Values "env" (merge (dict "WORLDBUILDER_MCP_ENABLED" "true") .Values.env) }}
{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets $secret) }}
{{- end }}
{{- end }}
{{- include "commonapi.manifest" . }}
