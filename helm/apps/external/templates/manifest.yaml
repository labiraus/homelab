{{- include "commonapi.worldbuilderSemanticConfig" . }}
{{- if .Values.nativeOAuth.enabled }}
{{- $secret := required "nativeOAuth.databaseSecret is required" .Values.nativeOAuth.databaseSecret }}
{{- $host := required "nativeOAuth.host is required" .Values.nativeOAuth.host }}
{{- $_ := set .Values "env" (merge (dict "MCP_OAUTH_ENABLED" "true" "MCP_OAUTH_ISSUER_URL" (printf "https://%s" $host) "MCP_OAUTH_COOKIE_AUTH_URL" (printf "http://%s.%s.svc.cluster.local/oauth2/auth" .Values.nativeOAuth.proxyRelease .Values.namespace)) (.Values.env | default dict)) }}
{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets $secret) }}
{{- end }}
{{- if .Values.worldbuilder.enabled }}
{{- $_ := set .Values "env" (merge (dict "WORLDBUILDER_ENABLED" "true") (.Values.env | default dict)) }}
{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets .Values.worldbuilder.databaseSecret) }}
{{- if or .Values.worldbuilder.aiSecret .Values.worldbuilder.semantic.enabled }}
{{- $budget := .Values.worldbuilder.aiBudget }}
{{- if eq $budget.mode "proxy" }}
{{- if or (empty $budget.profileRevision) (not (has $budget.profile (list "local-default" "bedrock-nova" "bedrock-sonnet"))) (ne $budget.currency "USD") (ne (int64 $budget.dailyRequests) 0) (ne (int64 $budget.requestMicros) 0) (ne (int64 $budget.dailyMicros) 0) }}{{ fail "proxy accounting requires pinned profile, USD and zero app quotas" }}{{ end }}
{{- else }}
{{- if or (lt (int64 $budget.requestMicros) 1) (lt (int64 $budget.dailyMicros) (int64 $budget.requestMicros)) (empty $budget.currency) (empty $budget.gatewayRoute) }}
{{- fail "Worldbuilder AI requires explicit positive per-request/daily allowances, currency and gateway route" }}
{{- end }}
{{- end }}
{{- $_ := set .Values "env" (merge (dict "WORLDBUILDER_AI_ACCOUNTING" ($budget.mode | default "legacy") "WORLDBUILDER_AI_PROFILE" ($budget.profile | default "") "WORLDBUILDER_AI_PROFILE_REVISION" ($budget.profileRevision | default "") "WORLDBUILDER_AI_DAILY_REQUESTS" (toString (int64 $budget.dailyRequests)) "WORLDBUILDER_AI_CONCURRENT" (toString (int64 $budget.concurrent)) "WORLDBUILDER_AI_REQUEST_MICROS" (toString (int64 $budget.requestMicros)) "WORLDBUILDER_AI_DAILY_MICROS" (toString (int64 $budget.dailyMicros)) "WORLDBUILDER_AI_CURRENCY" $budget.currency "WORLDBUILDER_AI_GATEWAY_ROUTE" $budget.gatewayRoute) .Values.env) }}
{{- if .Values.worldbuilder.aiSecret }}{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets .Values.worldbuilder.aiSecret) }}{{- end }}
{{- end }}
{{- if .Values.worldbuilder.mcp.enabled }}
{{- $secret := required "worldbuilder.mcp.delegationSecret is required" .Values.worldbuilder.mcp.delegationSecret }}
{{- $_ := set .Values "env" (merge (dict "WORLDBUILDER_MCP_ENABLED" "true") .Values.env) }}
{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets $secret) }}
{{- end }}
{{- if .Values.worldbuilder.jobs.enabled }}
{{- if empty .Values.worldbuilder.aiSecret }}{{- fail "generation jobs require configured AI" }}{{- end }}
{{- $secret := required "worldbuilder.jobs.workerSecret is required" .Values.worldbuilder.jobs.workerSecret }}
{{- $_ := set .Values "env" (merge (dict "WORLDBUILDER_JOBS_ENABLED" "true") .Values.env) }}
{{- $_ := set .Values "envFromSecrets" (append .Values.envFromSecrets $secret) }}
{{- end }}
{{- end }}
{{- include "commonapi.manifest" . }}
