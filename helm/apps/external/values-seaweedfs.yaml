# Prepared cutover overlay; apply only after docs/SeaweedFSMigration.md gates.
# Helm replaces lists, so generatedSecrets and egress are complete.
generatedSecrets:
- name: external-data-connections
  stringData:
    NATS_URLS:
      value: nats://nats-nats.nats.svc.cluster.local:4222
    NATS_EVENTS_STREAM:
      value: document-events
    NATS_EVENTS_SUBJECT:
      value: documents.events.>
    ORCHESTRATOR_BASE_URL:
      value: http://homelab-orchestrator.homelab.svc.cluster.local
    PROCESSOR_BASE_URL:
      value: http://homelab-processor.homelab.svc.cluster.local
    POSTGRES_HOST:
      value: app-db-rw.data.svc.cluster.local
    POSTGRES_PORT:
      value: '5432'
    POSTGRES_DATABASE:
      value: app
    POSTGRES_USER:
      fromSecretRef:
        namespace: data
        name: app-db-bootstrap
        key: username
    POSTGRES_PASSWORD:
      fromSecretRef:
        namespace: data
        name: app-db-bootstrap
        key: password
    OPENSEARCH_BASE_URL:
      value: http://labiraus-rag-data.data.svc.cluster.local:9200
    OPENSEARCH_RAG_INDEX:
      value: rag-documents
    OPENSEARCH_RAG_SEARCH_PIPELINE:
      value: ''
    OIDC_LOGIN_URL:
      value: https://mcp.labiraus.com/oauth2/start?rd=https%3A%2F%2Fmcp.labiraus.com%2F
    OIDC_ISSUER_URL:
      value: https://accounts.google.com
    MINIO_ENDPOINT:
      value: 192.168.8.177:8333
    MINIO_USE_SSL:
      value: 'false'
    MINIO_BUCKET:
      value: documents
    MINIO_ACCESS_KEY:
      fromSecretRef:
        namespace: homelab
        name: documents-s3-credentials
        key: accessKey
    MINIO_SECRET_KEY:
      fromSecretRef:
        namespace: homelab
        name: documents-s3-credentials
        key: secretKey
    REDIS_HOST:
      value: redis.data.svc.cluster.local
    REDIS_PORT:
      value: '6379'
    REDIS_PASSWORD:
      fromSecretRef:
        namespace: data
        name: redis-auth
        key: password
security:
  networkPolicy:
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: istio-system
        podSelector:
          matchLabels:
            app: istiod
      ports:
      - protocol: TCP
        port: 15012
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: nats
      ports:
      - protocol: TCP
        port: 4222
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
        podSelector:
          matchLabels:
            cnpg.io/cluster: app-db
      ports:
      - protocol: TCP
        port: 5432
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
        podSelector:
          matchLabels:
            app.kubernetes.io/name: redis
      ports:
      - protocol: TCP
        port: 6379
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
        podSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - opensearch-data
            - opensearch-ml
      ports:
      - protocol: TCP
        port: 9200
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: homelab
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: homelab-processor
            app.kubernetes.io/name: processor
      ports:
      - protocol: TCP
        port: 8080
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: homelab
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: homelab-orchestrator
            app.kubernetes.io/name: orchestrator
      ports:
      - protocol: TCP
        port: 8080
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: homelab
      ports:
      - protocol: TCP
        port: 80
    - to:
      - ipBlock:
          cidr: 192.168.8.177/32
      ports:
      - protocol: TCP
        port: 8333
