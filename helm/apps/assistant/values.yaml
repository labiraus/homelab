# Default values for assistant.

replicaCount: 1
minReadySeconds: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

readinessProbe:
  httpGet:
    path: /readiness
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /liveness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 5

namespace: homelab

image:
  repository: assistant
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

envFromSecrets:
  - assistant-config

generatedSecrets:
  - name: assistant-config
    stringData:
      POSTGRES_HOST:
        value: app-db-rw.data.svc.cluster.local
      POSTGRES_PORT:
        value: "5432"
      POSTGRES_DATABASE:
        value: app
      POSTGRES_USER:
        fromSecretRef:
          namespace: data
          name: app-db-bootstrap
          key: username
      POSTGRES_PASSWORD:
        fromSecretRef:
          namespace: data
          name: app-db-bootstrap
          key: password
      MCP_BASE_URL:
        value: "http://homelab-mcp.homelab.svc.cluster.local/mcp"
      MCP_CONTEXT_TIMEOUT_SECONDS:
        value: "5"
      ORCHESTRATOR_BASE_URL:
        value: "http://homelab-orchestrator.homelab.svc.cluster.local"
      AI_GATEWAY_BASE_URL:
        value: "http://homelab-vllm-ai-gateway.envoy-gateway-system.svc.cluster.local/v1"
      AI_CHAT_MODEL:
        value: "Qwen/Qwen2.5-0.5B-Instruct"
      AI_CHAT_MAX_TOKENS:
        value: "768"
      AI_EMBEDDING_MODEL:
        value: "rag-embedding-model"
      LLM_BASE_URL:
        value: "http://homelab-vllm-ai-gateway.envoy-gateway-system.svc.cluster.local/v1"
      LLM_MODEL:
        value: "Qwen/Qwen2.5-0.5B-Instruct"
      LLM_MAX_TOKENS:
        value: "768"

security:
  istio:
    peerAuthentication:
      enabled: true
      mode: STRICT
  networkPolicy:
    enabled: true
    defaultDenyIngress: true
    defaultDenyEgress: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: homelab
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: homelab-external
                app.kubernetes.io/name: external
        ports:
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: istio-system
            podSelector:
              matchLabels:
                app: istiod
        ports:
          - protocol: TCP
            port: 15012
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: data
            podSelector:
              matchLabels:
                cnpg.io/cluster: app-db
        ports:
          - protocol: TCP
            port: 5432
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: homelab
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: homelab-mcp
                app.kubernetes.io/name: mcp
        ports:
          - protocol: TCP
            port: 8080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: homelab
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: homelab-orchestrator
                app.kubernetes.io/name: orchestrator
        ports:
          - protocol: TCP
            port: 8080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: envoy-gateway-system
            podSelector:
              matchLabels:
                app.kubernetes.io/component: proxy
                app.kubernetes.io/name: envoy
                gateway.envoyproxy.io/owning-gateway-name: vllm-ai-gateway
                gateway.envoyproxy.io/owning-gateway-namespace: homelab
        ports:
          - protocol: TCP
            port: 80
          - protocol: TCP
            port: 10080

podAnnotations: {}
podLabels:
  testing_label_key: assistant

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  hosts: []
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  configValue: "default"
