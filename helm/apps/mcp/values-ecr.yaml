podLabels: {}

image:
  tag: "uat"

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: uat.labiraus.com
      paths:
        - path: /mcp
          pathType: PathPrefix
        - path: /sse
          pathType: Exact
        - path: /messages
          pathType: Exact
        - path: /message
          pathType: Exact
        - path: /.well-known/mcp.json
          pathType: Exact
        - path: /.well-known/oauth-protected-resource
          pathType: Exact
        - path: /.well-known/oauth-protected-resource/mcp
          pathType: Exact

tolerations:
  - key: "karpenter.sh/controller"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

env:
  configValue: "eks"
