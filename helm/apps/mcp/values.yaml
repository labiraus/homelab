# Default values for mcp.

replicaCount: 1
minReadySeconds: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

readinessProbe:
  httpGet:
    path: /readiness
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /liveness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 5

namespace: homelab

image:
  repository: mcp
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

security:
  istio:
    peerAuthentication:
      enabled: true
      mode: STRICT
    authorizationPolicy:
      enabled: true
      action: ALLOW
      rules:
        - from:
            - source:
                principals:
                  - cluster.local/ns/ingress/sa/gateway-istio
          to:
            - operation:
                ports: ["8080"]
  networkPolicy:
    enabled: true
    defaultDenyIngress: true
    defaultDenyEgress: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress
        ports:
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: istio-system
            podSelector:
              matchLabels:
                app: istiod
        ports:
          - protocol: TCP
            port: 15012

podAnnotations: {}
podLabels:
  testing_label_key: mcp

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  httpsRedirect: true
  className: ""
  annotations: {}
  hosts:
    - host: mcp.labiraus.com
      paths:
        - path: /mcp
          pathType: PathPrefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  configValue: "default"
  OIDC_ISSUER_URL: "https://accounts.google.com"
  # API_BASE_URL: "http://orchestrator.homelab.svc.cluster.local:8080"
  # POSTGRES_HOST: "postgresql.homelab.svc.cluster.local"
  # POSTGRES_PORT: "5432"
  # POSTGRES_USER: ""
  # POSTGRES_PASSWORD: ""
  # POSTGRES_DATABASE: ""
  # POSTGRES_SSLMODE: "disable"
  # MINIO_ENDPOINT: "svartalfheim.labiraus.com:9000"
  # MINIO_ACCESS_KEY: ""
  # MINIO_SECRET_KEY: ""
  # MINIO_USE_SSL: "true"
  # MINIO_REGION: ""
  # MINIO_BUCKET: "documents"
