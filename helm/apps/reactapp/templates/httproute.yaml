{{- if .Values.ingress.enabled -}}
{{- $root := . -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- $httpsRedirect := (get $ingress "httpsRedirect" | default false) -}}
{{- $httpListenerName := (get $ingress "httpListenerName" | default "default") -}}
{{- $httpsListenerName := (get $ingress "httpsListenerName" | default "https") -}}
{{- range $host := .Values.ingress.hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "reactapp.fullname" $root }}
  namespace: {{ $root.Values.namespace }}
spec:
  hostnames: [{{ $host.host }}]
  parentRefs:
  - name: gateway
    namespace: ingress
    {{- if $httpsRedirect }}
    sectionName: {{ $httpsListenerName }}
    {{- end }}
  rules:
  {{- range $path := $host.paths }}
  - matches:
    - path:
        type: {{ $path.pathType }}
        value: {{ $path.path }}
    backendRefs:
    - name: {{ include "reactapp.fullname" $root }}
      kind: Service
      port: 8000
  {{- end }}
---
{{- if $httpsRedirect }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "reactapp.fullname" $root }}-http-redirect
  namespace: {{ $root.Values.namespace }}
spec:
  hostnames: [{{ $host.host }}]
  parentRefs:
  - name: gateway
    namespace: ingress
    sectionName: {{ $httpListenerName }}
  rules:
  {{- range $path := $host.paths }}
  - matches:
    - path:
        type: {{ $path.pathType }}
        value: {{ $path.path }}
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
