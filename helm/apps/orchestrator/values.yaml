# Default values for orchestrator.

replicaCount: 1
minReadySeconds: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

readinessProbe:
  httpGet:
    path: /readiness
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /liveness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 5

namespace: homelab

image:
  repository: orchestrator
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

envFromSecrets:
  - orchestrator-config

generatedSecrets:
  - name: orchestrator-config
    stringData:
      NATS_URLS:
        value: nats://nats-nats.nats.svc.cluster.local:4222
      NATS_STREAM:
        value: documents
      NATS_SUBJECT:
        value: documents.ingest
      POSTGRES_HOST:
        value: app-db-rw.data.svc.cluster.local
      POSTGRES_PORT:
        value: "5432"
      POSTGRES_DATABASE:
        value: app
      POSTGRES_USER:
        fromSecretRef:
          namespace: data
          name: app-db-bootstrap
          key: username
      POSTGRES_PASSWORD:
        fromSecretRef:
          namespace: data
          name: app-db-bootstrap
          key: password

security:
  istio:
    peerAuthentication:
      enabled: true
      mode: STRICT
  networkPolicy:
    enabled: true
    defaultDenyIngress: true
    defaultDenyEgress: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: homelab
        ports:
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: istio-system
            podSelector:
              matchLabels:
                app: istiod
        ports:
          - protocol: TCP
            port: 15012
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: nats
        ports:
          - protocol: TCP
            port: 4222
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: data
        ports:
          - protocol: TCP
            port: 5432

podAnnotations: {}
podLabels:
  testing_label_key: orchestrator

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  hosts: []
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  configValue: "default"
