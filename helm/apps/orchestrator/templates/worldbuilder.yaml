{{- if .Values.worldbuilder.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commonapi.fullname" . }}-worldbuilder-index
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "commonapi.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [opensearch-data, opensearch-ml]
      ports:
        - protocol: TCP
          port: 9200
{{- end }}
