{{- if .Values.worldbuilder.jobs.enabled }}
{{- if not .Values.worldbuilder.enabled }}{{- fail "generation jobs require Worldbuilder relay" }}{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commonapi.fullname" . }}-generation-worker
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "commonapi.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: homelab-external
              app.kubernetes.io/name: external
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
