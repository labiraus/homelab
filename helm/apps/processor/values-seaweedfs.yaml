# Prepared cutover overlay; apply only after docs/SeaweedFSMigration.md gates.
# Helm replaces lists, so generatedSecrets and egress are complete.
generatedSecrets:
- name: processor-config
  stringData:
    NATS_URLS:
      value: nats://nats-nats.nats.svc.cluster.local:4222
    NATS_STREAM:
      value: documents
    NATS_SUBJECT:
      value: documents.ingest
    NATS_CONSUMER:
      value: processor
    MINIO_ENDPOINT:
      value: svartalfheim:8333
    MINIO_USE_SSL:
      value: 'false'
    MINIO_BUCKET:
      value: documents
    MINIO_ACCESS_KEY:
      fromSecretRef:
        namespace: homelab
        name: documents-s3-credentials
        key: accessKey
    MINIO_SECRET_KEY:
      fromSecretRef:
        namespace: homelab
        name: documents-s3-credentials
        key: secretKey
    OPENSEARCH_BASE_URL:
      value: http://labiraus-rag-data.data.svc.cluster.local:9200
    OPENSEARCH_RAG_INDEX:
      value: rag-documents
    OPENSEARCH_RAG_INGEST_PIPELINE:
      value: rag-native-ingest
    OPENSEARCH_RAG_SEARCH_PIPELINE:
      value: rag-neural-search
    OPENSEARCH_RAG_MODEL_ID:
      value: rag-embedding-model
    OPENSEARCH_VECTOR_DIMENSIONS:
      value: '1024'
    OPENSEARCH_CHUNK_TOKEN_LIMIT:
      value: '384'
    OPENSEARCH_CHUNK_OVERLAP_RATE:
      value: '0.15'
    POSTGRES_HOST:
      value: app-db-rw.data.svc.cluster.local
    POSTGRES_PORT:
      value: '5432'
    POSTGRES_DATABASE:
      value: app
    POSTGRES_USER:
      fromSecretRef:
        namespace: data
        name: app-db-bootstrap
        key: username
    POSTGRES_PASSWORD:
      fromSecretRef:
        namespace: data
        name: app-db-bootstrap
        key: password
    EXTERNAL_BASE_URL:
      value: http://homelab-external.homelab.svc.cluster.local
    ORCHESTRATOR_BASE_URL:
      value: http://homelab-orchestrator.homelab.svc.cluster.local
    AI_GATEWAY_BASE_URL:
      value: http://homelab-vllm-ai-gateway.envoy-gateway-system.svc.cluster.local/v1
    AI_CHAT_MODEL:
      value: Qwen/Qwen2.5-0.5B-Instruct
    AI_CHAT_MAX_TOKENS:
      value: '768'
security:
  networkPolicy:
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: istio-system
        podSelector:
          matchLabels:
            app: istiod
      ports:
      - protocol: TCP
        port: 15012
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: nats
      ports:
      - protocol: TCP
        port: 4222
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
      ports:
      - protocol: TCP
        port: 5432
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: data
        podSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - opensearch-data
            - opensearch-ml
      ports:
      - protocol: TCP
        port: 9200
    - to:
      - ipBlock:
          cidr: 192.168.8.177/32
      ports:
      - protocol: TCP
        port: 8333
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: homelab
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: homelab-external
            app.kubernetes.io/name: external
      ports:
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 8080
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: homelab
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: homelab-orchestrator
            app.kubernetes.io/name: orchestrator
      ports:
      - protocol: TCP
        port: 8080
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: envoy-gateway-system
        podSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
            app.kubernetes.io/name: envoy
            gateway.envoyproxy.io/owning-gateway-name: vllm-ai-gateway
            gateway.envoyproxy.io/owning-gateway-namespace: homelab
      ports:
      - protocol: TCP
        port: 80
      - protocol: TCP
        port: 10080
