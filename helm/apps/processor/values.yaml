# Default values for processor.

replicaCount: 1
minReadySeconds: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

readinessProbe:
  httpGet:
    path: /readiness
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /liveness
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 5

namespace: homelab

image:
  repository: processor
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

envFromSecrets:
  - processor-config

generatedSecrets:
  - name: processor-config
    stringData:
      NATS_URLS:
        value: nats://nats-nats.nats.svc.cluster.local:4222
      NATS_STREAM:
        value: documents
      NATS_SUBJECT:
        value: documents.ingest
      NATS_CONSUMER:
        value: processor
      MINIO_ENDPOINT:
        value: "svartalfheim:9000"
      MINIO_USE_SSL:
        value: "false"
      MINIO_BUCKET:
        value: "documents"
      MINIO_ACCESS_KEY:
        fromSecretRef:
          namespace: homelab
          name: documents-minio-credentials
          key: accessKey
      MINIO_SECRET_KEY:
        fromSecretRef:
          namespace: homelab
          name: documents-minio-credentials
          key: secretKey
      OPENSEARCH_BASE_URL:
        value: "http://labiraus-rag-data.data.svc.cluster.local:9200"
      OPENSEARCH_RAG_INDEX:
        value: "rag-documents"
      OPENSEARCH_RAG_INGEST_PIPELINE:
        value: "rag-native-ingest"
      OPENSEARCH_RAG_SEARCH_PIPELINE:
        value: "rag-neural-search"
      OPENSEARCH_RAG_MODEL_ID:
        value: "rag-embedding-model"
      OPENSEARCH_VECTOR_DIMENSIONS:
        value: "1024"
      OPENSEARCH_CHUNK_TOKEN_LIMIT:
        value: "384"
      OPENSEARCH_CHUNK_OVERLAP_RATE:
        value: "0.15"
      OPENSEARCH_USERNAME:
        fromSecretRef:
          namespace: data
          name: opensearch-admin
          key: username
      OPENSEARCH_PASSWORD:
        fromSecretRef:
          namespace: data
          name: opensearch-admin
          key: password
      POSTGRES_HOST:
        value: app-db-rw.data.svc.cluster.local
      POSTGRES_PORT:
        value: "5432"
      POSTGRES_DATABASE:
        value: app
      POSTGRES_USER:
        fromSecretRef:
          namespace: data
          name: app-db-bootstrap
          key: username
      POSTGRES_PASSWORD:
        fromSecretRef:
          namespace: data
          name: app-db-bootstrap
          key: password
      EXTERNAL_BASE_URL:
        value: "http://homelab-external.homelab.svc.cluster.local"
      ORCHESTRATOR_BASE_URL:
        value: "http://homelab-orchestrator.homelab.svc.cluster.local"
      AI_GATEWAY_BASE_URL:
        value: "http://homelab-vllm-ai-gateway.envoy-gateway-system.svc.cluster.local/v1"
      AI_CHAT_MODEL:
        value: "Qwen/Qwen2.5-0.5B-Instruct"
      AI_CHAT_MAX_TOKENS:
        value: "768"

security:
  istio:
    peerAuthentication:
      enabled: true
      mode: STRICT
  networkPolicy:
    enabled: true
    defaultDenyIngress: true
    defaultDenyEgress: true
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: homelab
        ports:
          - protocol: TCP
            port: 8080
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
            podSelector:
              matchLabels:
                k8s-app: kube-dns
        ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: istio-system
            podSelector:
              matchLabels:
                app: istiod
        ports:
          - protocol: TCP
            port: 15012
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: nats
        ports:
          - protocol: TCP
            port: 4222
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: data
        ports:
          - protocol: TCP
            port: 5432
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: data
            podSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - opensearchData
                    - opensearchMl
        ports:
          - protocol: TCP
            port: 9200
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
        ports:
          - protocol: TCP
            port: 9000
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: homelab
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: homelab-external
                app.kubernetes.io/name: external
        ports:
          - protocol: TCP
            port: 8080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: homelab
            podSelector:
              matchLabels:
                app.kubernetes.io/instance: homelab-orchestrator
                app.kubernetes.io/name: orchestrator
        ports:
          - protocol: TCP
            port: 8080
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: envoy-gateway-system
            podSelector:
              matchLabels:
                app.kubernetes.io/component: proxy
                app.kubernetes.io/name: envoy
                gateway.envoyproxy.io/owning-gateway-name: vllm-ai-gateway
                gateway.envoyproxy.io/owning-gateway-namespace: homelab
        ports:
          - protocol: TCP
            port: 80
          - protocol: TCP
            port: 10080

podAnnotations: {}
podLabels:
  testing_label_key: processor

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  hosts: []
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  natsJetStream:
    natsServerMonitoringEndpoint: nats-nats-headless.nats.svc.cluster.local:8222
    account: $G
    stream: documents
    consumer: processor
    lagThreshold: "5"

nodeSelector: {}
tolerations: []
affinity: {}

env:
  configValue: "default"
