apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger-grafana
  namespace: flux-system
spec:
  interval: 6h
  targetNamespace: istio-system
  chart:
    spec:
      chart: grafana
      sourceRef:
        kind: HelmRepository
        name: flagger
        namespace: flux-system
  dependsOn:
    - name: prometheus