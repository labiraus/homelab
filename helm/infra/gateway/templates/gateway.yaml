apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: {{ .Values.ingress.namespace }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    external-dns.alpha.kubernetes.io/hostname: "{{ .Values.ingress.hostname }}"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    {{- if .Values.tls }}
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "{{ .Values.acm.certificateArn }}"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    {{- end }}
spec:
  gatewayClassName: istio
  listeners:
  - name: default
    hostname: {{ .Values.ingress.hostname | quote }}
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
{{- if .Values.tls }}
  - name: https
    port: 443
    protocol: HTTPS
    hostname: uat.k8s-quickstart.com
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: uat-k8s-quickstart-com-tls
{{- end }}