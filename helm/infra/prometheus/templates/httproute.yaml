{{- $root := . -}}
{{- $ingress := .Values.ingress | default dict -}}
{{- if (get $ingress "enabled" | default false) -}}
{{- range $host := (get $ingress "hosts" | default list) }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "prometheus.fullname" $root }}
  namespace: istio-system
spec:
  hostnames: [{{ $host.host }}]
  parentRefs:
  - name: gateway
    namespace: ingress
  rules:
  {{- range $path := $host.paths }}
  - matches:
    - path:
        type: {{ $path.pathType }}
        value: {{ $path.path }}
    backendRefs:
    - name: prometheus-grafana
      kind: Service
      port: 80
  {{- end }}
---
{{- end }}
{{- end }}
