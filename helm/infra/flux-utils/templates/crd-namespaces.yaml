{{- $seen := dict -}}
{{- $all := (include "flux-utils.allReleases" . | fromYamlArray) -}}
{{- $namespaces := list -}}
{{- range $r := $all -}}
  {{- if eq $r.type "helm" -}}
    {{- $ns := $r.targetNamespace | default $r.name -}}
    {{- if not (hasKey $seen $ns) -}}
      {{- $_ := set $seen $ns true -}}
      {{- $namespaces = append $namespaces $ns -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- range $i, $ns := $namespaces }}
{{ if gt $i 0 }}---
{{ end }}apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
{{ end }}
