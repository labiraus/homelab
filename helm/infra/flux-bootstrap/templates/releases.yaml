{{- $root := . -}}
{{- range $chart := .Values.charts }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $chart }}
  namespace: flux-system
spec:
  prune: true
  interval: 1m
  dependsOn: 
    - name: gateway-api
      namespace: flux-system
  sourceRef:
    kind: OCIRepository
    name: {{ $chart }}
  path: ./
---
{{- end }}