{{- $root := . -}}
{{- range $chart := .Values.charts }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $chart }}
  namespace: flux-system
spec:
  interval: 1m
  dependsOn: 
    - name: gateway-api
      namespace: flux-system
  chartRef:
    kind: OCIRepository
    name: {{ $chart }}
    namespace: flux-system
---
{{- end }}
