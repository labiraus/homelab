{{- $all := (include "flux-bootstrap.allReleases" . | fromYamlArray) -}}
{{- range $r := $all }}
{{- $depNames := list -}}
{{- with $r.dependsOn }}
{{- range $dep := . }}
{{- $depNames = append $depNames $dep -}}
{{- end }}
{{- end }}
{{- with $r.dependencies }}
{{- range $dep := . }}
{{- $depNames = append $depNames $dep.name -}}
{{- end }}
{{- end }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $r.name }}
  namespace: flux-system
spec:
  interval: {{ $r.interval | default (ternary "1m" "1h" (eq $r.type "oci")) }}
  timeout: {{ $r.timeout | default "10m" }}
  targetNamespace: {{ $r.targetNamespace | default $r.name }}
  install:
    createNamespace: true
    replace: true
    {{- if hasKey $r "installDisableWait" }}
    disableWait: {{ $r.installDisableWait }}
    {{- end }}
    {{- if eq $r.type "helm" }}
    crds: CreateReplace
    {{- end }}
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    cleanupOnFail: true
    {{- if hasKey $r "upgradeDisableWait" }}
    disableWait: {{ $r.upgradeDisableWait }}
    {{- end }}
    {{- if eq $r.type "helm" }}
    crds: CreateReplace
    {{- end }}
    remediation:
      remediateLastFailure: true
      retries: 3
  {{- if gt (len $depNames) 0 }}
  dependsOn:
    {{- range $dep := uniq $depNames }}
    - name: {{ $dep }}
      namespace: flux-system
    {{- end }}
  {{- end }}
  {{- if eq $r.type "oci" }}
  chartRef:
    kind: OCIRepository
    name: {{ $r.name }}
    namespace: flux-system
  {{- else if eq $r.type "helm" }}
  chart:
    spec:
      chart: {{ $r.chart }}
      sourceRef:
        kind: HelmRepository
        name: {{ $r.repository.name }}
        namespace: flux-system
      {{- if $r.version }}
      version: {{ $r.version | quote }}
      {{- end }}
  {{- end }}
  {{- with $r.values }}
  values:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
