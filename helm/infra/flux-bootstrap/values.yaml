namespace: homelab
provider: generic
tag: uat
secret: true
image:
  repository:
min_version: 0.0.0-0
releases:
  - name: flux-apps
    type: oci
    targetNamespace: flux-system
    installDisableWait: true
    upgradeDisableWait: true

  - name: flux-utils
    type: oci
    targetNamespace: flux-system
    installDisableWait: true
    upgradeDisableWait: true

  - name: cert-issuers
    type: oci
    timeout: 30m
    installDisableWait: true
    upgradeDisableWait: true
    dependencies:
      - name: cert-manager
        type: helm
        interval: 1h
        repository:
          name: jetstack
          url: https://charts.jetstack.io
        chart: cert-manager
        version: 1.18.x
        targetNamespace: cert-manager
        values:
          crds:
            enabled: true

  - name: flagger
    type: oci

  - name: istio
    type: oci

  - name: prometheus
    type: oci

  - name: gateway
    type: oci

  - name: jaeger
    type: oci

  - name: kiali
    type: oci

  - name: kubecost
    type: oci
    timeout: 20m

  - name: metallb
    type: oci
    dependencies:
      - name: metallb-system
        type: helm
        interval: 1h
        repository:
          name: metallb
          url: https://metallb.github.io/metallb
        chart: metallb
        version: 0.15.x
        targetNamespace: metallb-system

  - name: longhorn-system
    type: helm
    interval: 1h
    repository:
      name: longhorn
      url: https://charts.longhorn.io
    chart: longhorn
    targetNamespace: longhorn-system

  - name: namespace
    type: oci
