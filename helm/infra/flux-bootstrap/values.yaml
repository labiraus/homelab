namespace: homelab
provider: generic
tag: uat
secret: true
image:
  repository:
min_version: 0.0.0-0
releases:
  - name: cert-issuers
    type: oci
    dependencies:
      - name: cert-manager
        type: helm
        interval: 1h
        repository:
          name: jetstack
          url: https://charts.jetstack.io
        chart: cert-manager
        version: 1.18.x
        targetNamespace: cert-manager
        values:
          crds:
            enabled: true

  - name: flagger
    type: oci

  - name: istio
    type: oci

  - name: prometheus
    type: oci

  - name: gateway
    type: oci

  - name: jaeger
    type: oci

  - name: kiali
    type: oci

  - name: kubecost
    type: oci
    timeout: 20m

  - name: metallb
    type: oci
    dependencies:
      - name: metallb-system
        type: helm
        interval: 1h
        repository:
          name: metallb
          url: https://metallb.github.io/metallb
        chart: metallb
        version: 0.15.x
        targetNamespace: metallb-system

  - name: longhorn-system
    type: helm
    interval: 1h
    repository:
      name: longhorn
      url: https://charts.longhorn.io
    chart: longhorn
    targetNamespace: longhorn-system

  - name: namespace
    type: oci

  - name: goapi
    type: oci
    dependsOn:
      - flagger

  - name: pythonapi
    type: oci
    dependsOn:
      - flagger

  - name: reactapp
    type: oci

  - name: harvester
    type: oci

  - name: kafka
    type: oci
    dependencies:
      - name: strimzi-kafka-operator
        type: helm
        interval: 1h
        timeout: 20m
        repository:
          name: strimzi
          url: https://strimzi.io/charts/
        chart: strimzi-kafka-operator
        targetNamespace: kafka

  - name: minio
    type: oci
    dependencies:
      - name: minio-operator
        type: helm
        interval: 1h
        repository:
          name: minio-operator
          url: https://operator.min.io/
        chart: operator
        targetNamespace: minio-operator

  - name: mongo
    type: oci
    dependencies:
      - name: mongodb-operator-crds
        type: helm
        interval: 1h
        repository:
          name: mongodb
          url: https://mongodb.github.io/helm-charts
        chart: community-operator-crds
        targetNamespace: mongodb
      - name: mongodb-operator
        type: helm
        interval: 1h
        dependsOn:
          - mongodb-operator-crds
        repository:
          name: mongodb
          url: https://mongodb.github.io/helm-charts
        chart: community-operator
        targetNamespace: mongodb

  - name: plex
    type: oci

  - name: postgres
    type: oci
    dependsOn:
      - longhorn-system
    dependencies:
      - name: cnpg-system
        type: helm
        interval: 1h
        repository:
          name: cnpg
          url: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        version: 0.23.x
        targetNamespace: cnpg-system

  - name: redis
    type: oci
    dependsOn:
      - longhorn-system
