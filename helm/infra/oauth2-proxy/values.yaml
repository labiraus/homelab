# Default values for oauth2-proxy.

replicaCount: 1
minReadySeconds: 5
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

readinessProbe:
  httpGet:
    path: /ping
    port: 4180
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 6

livenessProbe:
  httpGet:
    path: /ping
    port: 4180
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

lifecycle:
  preStop:
    exec:
      command:
        - /bin/sh
        - -c
        - sleep 5

namespace: homelab

image:
  repository: quay.io/oauth2-proxy/oauth2-proxy
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

envFromSecrets:
  - oauth2-proxy-google

security:
  istio:
    peerAuthentication:
      enabled: true
      mode: STRICT
    authorizationPolicies:
      - nameSuffix: ingress-allow
        action: ALLOW
        rules:
          - from:
              - source:
                  principals:
                    - cluster.local/ns/ingress/sa/gateway-istio
            to:
              - operation:
                  ports: ["4180"]
  networkPolicy:
    enabled: false

podAnnotations: {}
podLabels:
  testing_label_key: oauth2-proxy

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 4180

ingress:
  enabled: true
  httpsRedirect: true
  className: ""
  annotations: {}
  hosts:
    - host: mcp.labiraus.com
      paths:
        - path: /api
          pathType: PathPrefix
        - path: /oauth2
          pathType: Exact
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
        - path: /oauth2/auth
          pathType: Exact
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
        - path: /oauth2/auth/
          pathType: PathPrefix
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
        - path: /oauth2
          pathType: PathPrefix
        - path: /
          pathType: PathPrefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  configValue: "default"
  OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
  OAUTH2_PROXY_PROVIDER: "google"
  OAUTH2_PROXY_UPSTREAMS: "http://homelab-external.homelab.svc.cluster.local:80/api/,http://homelab-ui.homelab.svc.cluster.local:8000/"
  OAUTH2_PROXY_REVERSE_PROXY: "true"
  OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
  OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
  OAUTH2_PROXY_SCOPE: "openid email profile"
  OAUTH2_PROXY_EMAIL_DOMAINS: "*"
  OAUTH2_PROXY_REDIRECT_URL: "https://mcp.labiraus.com/oauth2/callback"
  OAUTH2_PROXY_COOKIE_DOMAINS: "mcp.labiraus.com"
  OAUTH2_PROXY_WHITELIST_DOMAINS: "mcp.labiraus.com"
  OAUTH2_PROXY_COOKIE_SECURE: "true"
  OAUTH2_PROXY_COOKIE_SAMESITE: "lax"
  OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
  OAUTH2_PROXY_PASS_USER_HEADERS: "true"
  OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "true"
