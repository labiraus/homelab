{{- $ns := .Values.namespace | default .Release.Name -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels: 
    istio-injection: "enabled"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
