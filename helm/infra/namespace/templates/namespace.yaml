{{- $defaultNamespaces := list (dict "name" (.Values.namespace | default "homelab") "labels" (dict "istio-injection" "enabled")) -}}
{{- $namespaces := .Values.namespaces | default $defaultNamespaces -}}
{{- range $i, $ns := $namespaces }}
{{- if gt $i 0 }}
---
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns.name | quote }}
  {{- with $ns.labels }}
  labels:
{{ toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with $ns.annotations }}
{{ toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
