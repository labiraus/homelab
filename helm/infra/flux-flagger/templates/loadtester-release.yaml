apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flagger-loadtester
  namespace: flux-system
spec:
  prune: true
  interval: 6h
  wait: true
  timeout: 5m
  targetNamespace: {{ .Values.namespace }}
  sourceRef:
    kind: OCIRepository
    name: flagger-loadtester
  path: ./tester
