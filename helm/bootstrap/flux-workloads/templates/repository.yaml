{{- $root := . -}}
{{- $all := (include "flux-workloads.allReleases" . | fromYamlArray) -}}
{{- range $r := $all }}
{{- if eq $r.type "oci" }}
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: {{ $r.name }}
  namespace: flux-system
spec:
  interval: 1m
  url: oci://{{ $root.Values.image.repository }}/charts/{{ $r.name }}
  provider: {{ $root.Values.provider }}
  {{- if $root.Values.secret }}
  secretRef:
    name: ghcr-creds
  {{- end }}
  ref:
    semver: ">={{ $root.Values.min_version }}"
    semverFilter: {{ $root.Values.tag }}
---{{ "\n" }}
{{- end }}
{{- end }}
