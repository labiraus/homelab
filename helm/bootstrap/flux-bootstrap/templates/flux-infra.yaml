{{- $component := index .Values "flux-infra" -}}
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: flux-infra
  namespace: flux-system
spec:
  interval: 1m
  url: oci://{{ .Values.image.repository }}/charts/flux-infra
  provider: {{ .Values.provider }}
  {{- if .Values.secret }}
  secretRef:
    name: ghcr-creds
  {{- end }}
  ref:
    semver: ">={{ .Values.min_version }}"
    semverFilter: {{ .Values.tag }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-infra
  namespace: flux-system
spec:
  interval: {{ $component.interval | default "1m" }}
  timeout: {{ $component.timeout | default "10m" }}
  targetNamespace: {{ $component.targetNamespace | default "flux-system" }}
  install:
    createNamespace: true
    replace: true
    {{- if hasKey $component "installDisableWait" }}
    disableWait: {{ $component.installDisableWait }}
    {{- end }}
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    cleanupOnFail: {{ $component.cleanupOnFail | default true }}
    {{- if hasKey $component "upgradeDisableWait" }}
    disableWait: {{ $component.upgradeDisableWait }}
    {{- end }}
    remediation:
      remediateLastFailure: true
      retries: 3
  chartRef:
    kind: OCIRepository
    name: flux-infra
    namespace: flux-system
  values:
    {{- if $component.values }}
    {{- toYaml $component.values | nindent 4 }}
    {{- else }}
    {}
    {{- end }}
