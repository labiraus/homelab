apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: "v1.4.1"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  prune: true
  interval: 1h
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: gateway-api
    namespace: flux-system
  path: "./config/crd/experimental"
