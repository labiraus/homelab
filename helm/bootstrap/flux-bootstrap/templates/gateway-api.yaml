apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api # replace with the URL of your Git repository
  ref:
    tag: "v1.4.1" # replace with the tag or branch you want to use
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  prune: true
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: gateway-api
    namespace: flux-system
  path: "./config/crd"
