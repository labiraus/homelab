namespace: homelab
provider: generic
tag: uat
secret: true
image:
  repository:
min_version: 0.0.0-0
releases:
  - name: flux-apps
    type: oci
    targetNamespace: flux-system
    installDisableWait: true
    upgradeDisableWait: true

  - name: flux-observability
    type: oci
    targetNamespace: flux-system
    installDisableWait: true
    upgradeDisableWait: true

  - name: flux-data
    type: oci
    targetNamespace: flux-system
    installDisableWait: true
    upgradeDisableWait: true

  - name: cert-issuers
    type: oci
    timeout: 30m
    installDisableWait: true
    upgradeDisableWait: true
    dependencies:
      - name: cert-manager
        type: helm
        interval: 1h
        repository:
          name: jetstack
          url: https://charts.jetstack.io
        chart: cert-manager
        version: 1.18.x
        targetNamespace: cert-manager
        values:
          crds:
            enabled: true
          config:
            enableGatewayAPI: true

  - name: gateway
    type: oci
    dependsOn:
      - cert-issuers
      - istio
    values:
      ingress:
        namespace: ingress
        hostname: mcp.labiraus.com
      tls: true
      certificate:
        secretName: mcp-labiraus-com-tls
      internalGateway:
        namespace: ingress
        name: internal-gateway
        loadBalancerScheme: internal
        listeners:
          - name: postgres
            port: 5432
            protocol: TCP

  - name: istio
    type: oci

  - name: metallb
    type: oci
    dependencies:
      - name: metallb-system
        type: helm
        interval: 1h
        repository:
          name: metallb
          url: https://metallb.github.io/metallb
        chart: metallb
        version: 0.15.x
        targetNamespace: metallb-system

  - name: longhorn-system
    type: helm
    interval: 1h
    repository:
      name: longhorn
      url: https://charts.longhorn.io
    chart: longhorn
    targetNamespace: longhorn-system
    values:
      defaultSettings:
        defaultReplicaCount: 2
      persistence:
        defaultClass: true
        defaultClassReplicaCount: 2
        reclaimPolicy: Delete
