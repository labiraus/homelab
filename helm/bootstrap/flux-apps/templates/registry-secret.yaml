{{- if .Values.imagePullSecret.enabled }}
{{- $sourceSecret := lookup "v1" "Secret" .Values.imagePullSecret.sourceSecret.namespace .Values.imagePullSecret.sourceSecret.name -}}
{{- $sourceDockerconfigjson := "" -}}
{{- if $sourceSecret -}}
  {{- $sourceDockerconfigjson = index $sourceSecret.data ".dockerconfigjson" | default "" -}}
{{- end -}}
{{- if not (or .Values.imagePullSecret.dockerconfigjson $sourceDockerconfigjson) -}}
  {{- fail (printf "imagePullSecret.enabled is true but neither imagePullSecret.dockerconfigjson nor source secret %s/%s provided a .dockerconfigjson value" .Values.imagePullSecret.sourceSecret.namespace .Values.imagePullSecret.sourceSecret.name) -}}
{{- end -}}
{{- $seen := dict -}}
{{- $defaultNamespaces := list (dict "name" (.Values.namespace | default "homelab")) -}}
{{- $configuredNamespaces := .Values.namespaces | default $defaultNamespaces -}}
{{- $namespaces := list -}}
{{- range $ns := $configuredNamespaces -}}
  {{- if not (hasKey $seen $ns.name) -}}
    {{- $_ := set $seen $ns.name true -}}
    {{- $namespaces = append $namespaces $ns.name -}}
  {{- end -}}
{{- end -}}
{{- range $componentName := tuple "vllm" "assistant" "external" "ui" "mcp" "orchestrator" "processor" -}}
  {{- $component := index $.Values $componentName -}}
  {{- $ns := $component.targetNamespace | default $component.namespace | default $componentName -}}
  {{- if not (hasKey $seen $ns) -}}
    {{- $_ := set $seen $ns true -}}
    {{- $namespaces = append $namespaces $ns -}}
  {{- end -}}
{{- end -}}
{{- range $i, $ns := $namespaces }}
{{- if gt $i 0 }}
{{ "\n" }}---{{ "\n" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.imagePullSecret.name }}
  namespace: {{ $ns }}
type: kubernetes.io/dockerconfigjson
{{- if $.Values.imagePullSecret.dockerconfigjson }}
stringData:
  .dockerconfigjson: |
{{ $.Values.imagePullSecret.dockerconfigjson | nindent 4 }}
{{- else }}
data:
  .dockerconfigjson: {{ $sourceDockerconfigjson }}
{{- end }}
{{- end }}
{{- end }}
