{{- $seen := dict -}}
{{- $defaultNamespaces := list (dict "name" (.Values.namespace | default "homelab")) -}}
{{- $configuredNamespaces := .Values.namespaces | default $defaultNamespaces -}}
{{- $namespaces := list -}}
{{- range $ns := $configuredNamespaces -}}
  {{- if not (hasKey $seen $ns.name) -}}
    {{- $_ := set $seen $ns.name true -}}
    {{- $namespaces = append $namespaces $ns -}}
  {{- end -}}
{{- end -}}
{{- range $componentName := tuple "external" "ui" "mcp" "orchestrator" "processor" -}}
  {{- $component := index $.Values $componentName -}}
  {{- $ns := $component.targetNamespace | default $component.namespace | default $componentName -}}
  {{- if not (hasKey $seen $ns) -}}
    {{- $_ := set $seen $ns true -}}
    {{- $namespaces = append $namespaces (dict "name" $ns) -}}
  {{- end -}}
{{- end -}}
{{- range $i, $ns := $namespaces }}
{{- if gt $i 0 }}
{{ "\n" }}---{{ "\n" }}
{{- end }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns.name | quote }}
  {{- $labels := merge (dict "istio-injection" "enabled") ($ns.labels | default dict) }}
  labels:
{{ toYaml $labels | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- with $ns.annotations }}
{{ toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
