namespace: homelab
namespaces:
  - name: homelab
    labels:
      istio-injection: "enabled"
provider: generic
tag: uat
secret: true
image:
  repository:
imagePullSecret:
  enabled: false
  name: registry-key
  dockerconfigjson: ""
  sourceSecret:
    namespace: flux-system
    name: ghcr-creds
min_version: 0.0.0-0
vllm:
  type: oci
  namespace: homelab
  installDisableWait: true
  upgradeDisableWait: true
  dependsOn:
    - envoy-ai-gateway

assistant:
  type: oci
  namespace: homelab
  dependsOn:
    - postgres
    - mcp
    - orchestrator
    - vllm

external:
  type: oci
  namespace: homelab
  dependsOn:
    - postgres
    - redis
    - assistant

ui:
  type: oci
  namespace: homelab

mcp:
  type: oci
  namespace: homelab

orchestrator:
  type: oci
  namespace: homelab
  dependsOn:
    - nats

processor:
  type: oci
  namespace: homelab
  installDisableWait: true
  upgradeDisableWait: true
  dependsOn:
    - nats
    - postgres
    - keda
