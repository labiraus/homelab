namespace: homelab
namespaces:
  - name: homelab
    labels:
      istio-injection: "enabled"
provider: generic
tag: uat
secret: true
image:
  repository:
imagePullSecret:
  enabled: false
  name: registry-key
  dockerconfigjson: ""
  sourceSecret:
    namespace: flux-system
    name: ghcr-creds
min_version: 0.0.0-0
releases:
  - name: oauth2-proxy
    type: oci
    namespace: homelab

  - name: envoy-ai-gateway
    type: oci
    targetNamespace: flux-system

  - name: external
    type: oci
    namespace: homelab
    dependsOn:
      - postgres
      - redis

  - name: ui
    type: oci
    namespace: homelab

  - name: mcp
    type: oci
    namespace: homelab

  - name: orchestrator
    type: oci
    namespace: homelab
    dependsOn:
      - nats

  - name: processor
    type: oci
    namespace: homelab
    dependsOn:
      - nats
      - postgres
      - keda
