namespace: homelab
namespaces:
  - name: homelab
    labels:
      istio-injection: "enabled"
provider: generic
tag: uat
secret: true
image:
  repository:
imagePullSecret:
  enabled: false
  name: registry-key
  dockerconfigjson: ""
  sourceSecret:
    namespace: flux-system
    name: ghcr-creds
min_version: 0.0.0-0
external:
  type: oci
  namespace: homelab
  dependsOn:
    - postgres
    - redis
    - nats
    - orchestrator
    - processor
  values:
    nativeOAuth:
      enabled: true
      databaseSecret: native-oauth-external
      host: mcp.labiraus.com
      browserPrincipal: cluster.local/ns/homelab/sa/homelab-oauth2-proxy
      gatewayPrincipal: cluster.local/ns/ingress/sa/gateway-istio
      mcpPrincipal: cluster.local/ns/homelab/sa/homelab-mcp
    worldbuilder:
      enabled: true
      databaseSecret: worldbuilder-external
      browserPrincipal: cluster.local/ns/homelab/sa/homelab-oauth2-proxy
      aiSecret: ""
    ingress:
      enabled: false
    security:
      istio:
        authorizationPolicies: []
      networkPolicy:
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: homelab
                podSelector:
                  matchLabels:
                    app.kubernetes.io/instance: homelab-oauth2-proxy
                    app.kubernetes.io/name: oauth2-proxy
            ports:
              - protocol: TCP
                port: 8080
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: homelab
                podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - homelab-processor
                        - homelab-mcp
            ports:
              - protocol: TCP
                port: 8080

ui:
  type: oci
  namespace: homelab

mcp:
  type: oci
  namespace: homelab
  chartVersion: "" # Optional exact OCI tag during verified recovery.
  values:
    nativeOAuth:
      enabled: true
      host: mcp.labiraus.com

orchestrator:
  type: oci
  namespace: homelab
  dependsOn:
    - nats
  values:
    worldbuilder:
      enabled: true
      databaseSecret: worldbuilder-relay
      openSearchURL: http://labiraus-rag-data.data.svc.cluster.local:9200
      rebuildOnStart: false

processor:
  type: oci
  namespace: homelab
  installDisableWait: true
  upgradeDisableWait: true
  dependsOn:
    - nats
    - postgres
    - keda
    - vllm
