namespace: homelab
namespaces:
  - name: homelab
    labels:
      istio-injection: "enabled"
provider: generic
tag: uat
secret: true
image:
  repository:
imagePullSecret:
  enabled: false
  name: registry-key
  dockerconfigjson: ""
  sourceSecret:
    namespace: flux-system
    name: ghcr-creds
min_version: 0.0.0-0
releases:
  - name: goapi
    type: oci
    namespace: homelab
    dependsOn:
      - postgres
      - mongo
      - redis

  - name: pythonapi
    type: oci
    namespace: homelab
    dependsOn:
      - postgres
      - mongo
      - redis

  - name: reactapp
    type: oci
    namespace: homelab
