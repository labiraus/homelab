namespace: homelab
namespaces:
  - name: homelab
    labels:
      istio-injection: "enabled"
provider: generic
tag: uat
secret: true
image:
  repository:
imagePullSecret:
  enabled: false
  name: registry-key
  dockerconfigjson: ""
  sourceSecret:
    namespace: flux-system
    name: ghcr-creds
min_version: 0.0.0-0
external:
  type: oci
  namespace: homelab
  dependsOn:
    - postgres
    - redis
    - nats
    - orchestrator
    - processor
  values:
    ingress:
      enabled: false
    security:
      istio:
        authorizationPolicies: []
      networkPolicy:
        ingress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: homelab
                podSelector:
                  matchLabels:
                    app.kubernetes.io/instance: homelab-oauth2-proxy
                    app.kubernetes.io/name: oauth2-proxy
            ports:
              - protocol: TCP
                port: 8080
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: homelab
                podSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - homelab-processor
                        - homelab-mcp
            ports:
              - protocol: TCP
                port: 8080

ui:
  type: oci
  namespace: homelab

mcp:
  type: oci
  namespace: homelab

orchestrator:
  type: oci
  namespace: homelab
  dependsOn:
    - nats

processor:
  type: oci
  namespace: homelab
  installDisableWait: true
  upgradeDisableWait: true
  dependsOn:
    - nats
    - postgres
    - keda
    - vllm
