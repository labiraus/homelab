namespace: homelab
namespaces:
  - name: homelab
    labels:
      istio-injection: "enabled"
provider: generic
tag: uat
secret: true
image:
  repository:
imagePullSecret:
  enabled: false
  name: registry-key
  dockerconfigjson: ""
  sourceSecret:
    namespace: flux-system
    name: ghcr-creds
min_version: 0.0.0-0
releases:
  - name: vllm
    type: oci
    namespace: homelab
    installDisableWait: true
    upgradeDisableWait: true
    dependsOn:
      - envoy-ai-gateway

  - name: assistant
    type: oci
    namespace: homelab
    dependsOn:
      - postgres
      - mcp
      - orchestrator
      - vllm

  - name: external
    type: oci
    namespace: homelab
    dependsOn:
      - postgres
      - redis
      - assistant

  - name: ui
    type: oci
    namespace: homelab

  - name: mcp
    type: oci
    namespace: homelab

  - name: orchestrator
    type: oci
    namespace: homelab
    dependsOn:
      - nats

  - name: processor
    type: oci
    namespace: homelab
    installDisableWait: true
    upgradeDisableWait: true
    dependsOn:
      - nats
      - postgres
      - keda
