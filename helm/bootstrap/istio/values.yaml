meshConfig:
  accessLogFile: /dev/stdout
  extensionProviders:
    - name: mcp-oauth
      envoyExtAuthzHttp:
        service: homelab-external.homelab.svc.cluster.local
        port: '80'
        pathPrefix: /api/mcp-oauth/check?
        timeout: 5s
        failOpen: false
        statusOnError: "503"
        includeRequestHeadersInCheck:
        - authorization
        - cookie
        headersToUpstreamOnAllow:
        - x-auth-request-email
        - x-auth-request-user
        - x-forwarded-email
        headersToDownstreamOnDeny:
        - content-type
        - www-authenticate
    - name: oauth2-proxy
      envoyExtAuthzHttp:
        service: homelab-oauth2-proxy.homelab.svc.cluster.local
        port: "80"
        # Envoy appends the original path. Put it in an ignored query so the
        # check reaches the exact auth endpoint, never the UI reverse proxy.
        pathPrefix: /oauth2/auth?
        includeRequestHeadersInCheck:
          - authorization
          - cookie
          - x-forwarded-proto
          - x-forwarded-host
          - x-forwarded-uri
        includeAdditionalHeadersInCheck:
          X-Auth-Request-Redirect: https://%REQ(:authority)%/
        headersToUpstreamOnAllow:
          - authorization
          - path
          - x-auth-request-user
          - x-auth-request-email
          - x-auth-request-access-token
        headersToDownstreamOnAllow:
          - set-cookie
        headersToDownstreamOnDeny:
          - content-type
          - set-cookie
          - www-authenticate
  defaultConfig:
    gatewayTopology:
      forwardClientCertDetails: SANITIZE_SET
pilot:
  autoscaleEnabled: true
  autoscaleMin: 1
  autoscaleMax: 3
  env:
    PILOT_ENABLE_ALPHA_GATEWAY_API: "true"
