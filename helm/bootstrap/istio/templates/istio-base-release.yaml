apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: istio-system
  releaseName: istio-base
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: base
      sourceRef:
        kind: HelmRepository
        name: istio
  values:
    defaultRevision: default