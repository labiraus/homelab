{{- $component := .Values.opensearch -}}
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: opensearch
  namespace: flux-system
spec:
  interval: 1m
  url: oci://{{ .Values.image.repository }}/charts/opensearch
  provider: {{ .Values.provider }}
  {{- if .Values.secret }}
  secretRef:
    name: ghcr-creds
  {{- end }}
  ref:
    semver: ">={{ .Values.min_version }}"
    semverFilter: {{ .Values.tag }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch
  namespace: flux-system
spec:
  interval: {{ $component.interval | default "1m" }}
  timeout: {{ $component.timeout | default "30m" }}
  targetNamespace: {{ $component.targetNamespace | default "data" }}
  install:
    createNamespace: true
    replace: true
    remediation:
      remediateLastFailure: true
      retries: 3
  upgrade:
    cleanupOnFail: {{ $component.cleanupOnFail | default true }}
    remediation:
      remediateLastFailure: true
      retries: 3
  dependsOn:
    {{- range $dependency := $component.dependsOn }}
    - name: {{ $dependency }}
      namespace: flux-system
    {{- end }}
  chartRef:
    kind: OCIRepository
    name: opensearch
    namespace: flux-system
  values:
    {{- toYaml $component.values | nindent 4 }}
