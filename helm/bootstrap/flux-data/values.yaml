namespace: homelab
provider: generic
tag: uat
secret: true
image:
  repository:
min_version: 0.0.0-0
releases:
  - name: harvester
    type: oci

  - name: kafka
    type: oci
    dependencies:
      - name: strimzi-kafka-operator
        type: helm
        interval: 1h
        timeout: 20m
        repository:
          name: strimzi
          url: https://strimzi.io/charts/
        chart: strimzi-kafka-operator
        targetNamespace: kafka

  - name: keda
    type: helm
    interval: 1h
    repository:
      name: kedacore
      url: https://kedacore.github.io/charts
    chart: keda
    version: 2.16.x
    targetNamespace: keda

  - name: plex
    type: oci

  - name: postgres
    type: oci
    timeout: 30m
    dependsOn:
      - longhorn-system
      - gateway
    dependencies:
      - name: cnpg-system
        type: helm
        interval: 1h
        repository:
          name: cnpg
          url: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        version: 0.23.x
        targetNamespace: cnpg-system

  - name: redis
    type: oci
    dependsOn:
      - longhorn-system
