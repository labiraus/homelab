namespace: homelab
provider: generic
tag: uat
secret: true
image:
  repository:
min_version: 0.0.0-0
releases:
  - name: harvester
    type: oci

  - name: kafka
    type: oci
    dependencies:
      - name: strimzi-kafka-operator
        type: helm
        interval: 1h
        timeout: 20m
        repository:
          name: strimzi
          url: https://strimzi.io/charts/
        chart: strimzi-kafka-operator
        targetNamespace: kafka

  - name: minio
    type: oci
    dependsOn:
      - gateway
    dependencies:
      - name: minio-operator
        type: helm
        interval: 1h
        repository:
          name: minio-operator
          url: https://operator.min.io/
        chart: operator
        targetNamespace: minio-operator

  - name: mongo
    type: oci
    dependencies:
      - name: mongodb-operator-crds
        type: helm
        interval: 1h
        repository:
          name: mongodb
          url: https://mongodb.github.io/helm-charts
        chart: community-operator-crds
        targetNamespace: mongodb
      - name: mongodb-operator
        type: helm
        interval: 1h
        dependsOn:
          - mongodb-operator-crds
        repository:
          name: mongodb
          url: https://mongodb.github.io/helm-charts
        chart: community-operator
        targetNamespace: mongodb

  - name: plex
    type: oci

  - name: postgres
    type: oci
    timeout: 30m
    dependsOn:
      - longhorn-system
      - gateway
    dependencies:
      - name: cnpg-system
        type: helm
        interval: 1h
        repository:
          name: cnpg
          url: https://cloudnative-pg.github.io/charts
        chart: cloudnative-pg
        version: 0.23.x
        targetNamespace: cnpg-system

  - name: redis
    type: oci
    dependsOn:
      - longhorn-system
