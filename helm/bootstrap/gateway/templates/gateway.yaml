{{- $ingress := .Values.ingress | default (dict) -}}
{{- $ingressNamespace := (index $ingress "namespace") | default "ingress" -}}
{{- $ingressHostname := (index $ingress "hostname") | default "*.labiraus.com" -}}
{{- $certificate := .Values.certificate | default (dict) -}}
{{- $tlsSecretName := (index $certificate "secretName") | default "" -}}
{{- $clientCertificateValidation := .Values.clientCertificateValidation | default (dict) -}}
{{- $clientCertificateValidationEnabled := (index $clientCertificateValidation "enabled") | default false -}}
{{- $clientCASecretName := (index $clientCertificateValidation "secretName") | default "" -}}
{{- $acm := .Values.acm | default (dict) -}}
{{- $acmCertificateArn := (index $acm "certificateArn") | default "" -}}
{{- $aws := .Values.aws | default (dict) -}}
{{- $awsEnabled := (index $aws "enabled") | default false -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: {{ $ingressNamespace }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "{{ $ingressHostname }}"
    {{- if $awsEnabled }}
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    {{- if .Values.tls }}
    {{- if $acmCertificateArn }}
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "{{ $acmCertificateArn }}"
    {{- end }}
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    {{- end }}
    {{- end }}
spec:
  gatewayClassName: istio
  {{- if $clientCertificateValidationEnabled }}
  tls:
    frontend:
      default:
        validation:
          caCertificateRefs:
            - group: ""
              kind: Secret
              name: {{ $clientCASecretName }}
  {{- end }}
  listeners:
  - name: default
    hostname: {{ $ingressHostname | quote }}
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
{{- if .Values.tls }}
  - name: https
    port: 443
    protocol: HTTPS
    hostname: {{ $ingressHostname | quote }}
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ $tlsSecretName }}
{{- end }}
