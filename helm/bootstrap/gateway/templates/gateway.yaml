{{- $ingress := .Values.ingress | default (dict) -}}
{{- $ingressNamespace := (index $ingress "namespace") | default "ingress" -}}
{{- $ingressHostname := (index $ingress "hostname") | default "*.labiraus.com" -}}
{{- $tlsSecretName := .Values.certificate.secretName | default "" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: {{ $ingressNamespace }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    external-dns.alpha.kubernetes.io/hostname: "{{ $ingressHostname }}"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
    {{- if .Values.tls }}
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "{{ .Values.acm.certificateArn }}"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    {{- end }}
spec:
  gatewayClassName: istio
  listeners:
  - name: default
    hostname: {{ $ingressHostname | quote }}
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
{{- if .Values.tls }}
  - name: https
    port: 443
    protocol: HTTPS
    hostname: {{ $ingressHostname | quote }}
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ $tlsSecretName }}
{{- end }}
