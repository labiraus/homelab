{{- $internal := .Values.internalGateway | default (dict) -}}
{{- $listeners := (index $internal "listeners") | default list -}}
{{- $aws := .Values.aws | default (dict) -}}
{{- $awsEnabled := (index $aws "enabled") | default false -}}
{{- if gt (len $listeners) 0 -}}
{{- $namespace := (index $internal "namespace") -}}
{{- $name := (index $internal "name") -}}
{{- $scheme := (index $internal "loadBalancerScheme") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  {{- if $awsEnabled }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ $scheme | quote }}
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
  {{- end }}
spec:
  gatewayClassName: istio
  listeners:
  {{- range $listener := $listeners }}
  - name: {{ $listener.name }}
    port: {{ $listener.port }}
    protocol: {{ $listener.protocol }}
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
{{- end }}
