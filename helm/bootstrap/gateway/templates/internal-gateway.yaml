{{- $internal := .Values.internalGateway | default (dict) -}}
{{- $listeners := (index $internal "listeners") | default list -}}
{{- $certificate := .Values.certificate | default (dict) -}}
{{- $defaultTLSSecretName := (index $certificate "secretName") | default "" -}}
{{- $aws := .Values.aws | default (dict) -}}
{{- $awsEnabled := (index $aws "enabled") | default false -}}
{{- if gt (len $listeners) 0 -}}
{{- $namespace := (index $internal "namespace") -}}
{{- $name := (index $internal "name") -}}
{{- $scheme := (index $internal "loadBalancerScheme") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  {{- if $awsEnabled }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: {{ $scheme | quote }}
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: tcp
  {{- end }}
spec:
  gatewayClassName: istio
  listeners:
  {{- range $listener := $listeners }}
  - name: {{ $listener.name }}
    port: {{ $listener.port }}
    protocol: {{ $listener.protocol }}
    {{- with $listener.hostname }}
    hostname: {{ . | quote }}
    {{- end }}
    allowedRoutes:
      namespaces:
        from: All
    {{- $tls := ($listener.tls | default dict) }}
    {{- if and (eq $listener.protocol "HTTPS") (or ($tls.certificateRefs) $defaultTLSSecretName) }}
    tls:
      mode: {{ $tls.mode | default "Terminate" }}
      certificateRefs:
      {{- if $tls.certificateRefs }}
{{ toYaml $tls.certificateRefs | nindent 6 }}
      {{- else }}
      - kind: Secret
        name: {{ $defaultTLSSecretName }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
