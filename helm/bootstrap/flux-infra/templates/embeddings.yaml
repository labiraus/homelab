{{- $component := .Values.embeddings -}}
{{- if $component.enabled }}
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: embeddings
  namespace: flux-system
spec:
  interval: 1m
  url: oci://{{ .Values.image.repository }}/charts/embeddings
  provider: {{ .Values.provider }}
  {{- if .Values.secret }}
  secretRef:
    name: ghcr-creds
  {{- end }}
  ref:
    semver: ">={{ .Values.min_version }}"
    semverFilter: {{ .Values.tag }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: embeddings
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30m
  targetNamespace: {{ $component.namespace }}
  install:
    createNamespace: true
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  dependsOn:
    {{- range $component.dependsOn }}
    - name: {{ . }}
      namespace: flux-system
    {{- end }}
  chartRef:
    kind: OCIRepository
    name: embeddings
    namespace: flux-system
  values:
    {{- toYaml ($component.values | default dict) | nindent 4 }}
{{- end }}
