{{- if .Values.imagePullSecret.enabled }}
{{- $sourceSecret := lookup "v1" "Secret" .Values.imagePullSecret.sourceSecret.namespace .Values.imagePullSecret.sourceSecret.name -}}
{{- $dockerconfigjson := .Values.imagePullSecret.dockerconfigjson -}}
{{- if and (not $dockerconfigjson) $sourceSecret }}
{{- $dockerconfigjson = index $sourceSecret.data ".dockerconfigjson" -}}
{{- end }}
{{- if not $dockerconfigjson -}}
  {{- fail (printf "imagePullSecret.enabled is true but neither imagePullSecret.dockerconfigjson nor source secret %s/%s provided a .dockerconfigjson value" .Values.imagePullSecret.sourceSecret.namespace .Values.imagePullSecret.sourceSecret.name) -}}
{{- end }}
{{- $namespaces := dict -}}
{{- $_ := set $namespaces ((.Values.secrets.targetNamespace | default .Values.secrets.namespace | default "secrets")) true -}}
{{- $_ := set $namespaces ((index .Values "oauth2-proxy").targetNamespace | default (index .Values "oauth2-proxy").namespace | default "oauth2-proxy") true -}}
{{- $_ := set $namespaces ((index .Values "envoy-ai-gateway").targetNamespace | default (index .Values "envoy-ai-gateway").namespace | default "envoy-ai-gateway") true -}}
{{- $_ := set $namespaces (.Values.vllm.targetNamespace | default .Values.vllm.namespace | default "vllm") true -}}
{{- range $ns, $_ := $namespaces }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Values.imagePullSecret.name }}
  namespace: {{ $ns }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerconfigjson }}
---
{{- end }}
{{- end }}
