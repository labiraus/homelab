email: oliver@labiraus.com # EDIT THIS
http01GatewayParentRefs:
  - name: gateway
    namespace: ingress
    kind: Gateway
certificate:
  namespace: ingress
  name: mcp-labiraus-com
  secretName: mcp-labiraus-com-tls
  issuerName: letsencrypt-prod
  issuerKind: ClusterIssuer
  dnsNames:
    - mcp.labiraus.com
namecheap:
  enabled: false
  groupName: acme.labiraus.com # must match the installed cert-manager DNS webhook groupName
  webhookNamespace: cert-manager
  apiSecretName: namecheap-api-credentials
  manageApiSecret: false
  apiUser: "" # FILL IN WHEN YOU HAVE NAMECHEAP API ACCESS
  apiKey: "" # FILL IN WHEN YOU HAVE NAMECHEAP API ACCESS
  clientIp: "" # FILL IN WHEN YOU HAVE NAMECHEAP API ACCESS
