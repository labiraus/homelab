namespace: data

redis:
  name: redis
  image: redis:7.2.6-alpine
  replicas: 1
  port: 6379
  serviceType: ClusterIP
  auth:
    enabled: true
    password: ""
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
networkPolicy:
  enabled: true
  allowedClients:
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-external
