{{- $existing := lookup "v1" "Secret" .Values.namespace .Values.auth.secretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{- if $existing }} {{ index $existing.data "password" | b64dec | quote }} {{- else if .Values.auth.password }} {{ .Values.auth.password | quote }} {{- else }} {{ randAlphaNum 32 | quote }} {{- end }}
