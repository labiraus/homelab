{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - opensearch-data
          - opensearch-ml
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [opensearch-data, opensearch-ml]
      ports:
        - protocol: TCP
          port: 9300
    - from:
{{- range .Values.networkPolicy.allowedClients }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
{{ toYaml .podSelector | nindent 12 }}
{{- end }}
      ports:
        - protocol: TCP
          port: 9200
{{- end }}
