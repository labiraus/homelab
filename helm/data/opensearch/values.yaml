namespace: data

auth:
  secretName: opensearch-admin
  username: admin
  password: ""

opensearchData:
  enabled: true
  clusterName: labiraus-rag
  nodeGroup: data
  masterService: labiraus-rag-data
  replicas: 1
  roles:
    - cluster_manager
    - data
    - ingest
    - remote_cluster_client
  singleNode: true
  persistence:
    enabled: true
    storageClass: longhorn
    size: 40Gi
  opensearchJavaOpts: "-Xms1g -Xmx1g"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  extraEnvs:
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: opensearch-admin
          key: password

opensearchMl:
  enabled: true
  clusterName: labiraus-rag
  nodeGroup: ml
  masterService: labiraus-rag-data
  replicas: 1
  roles:
    - ml
    - remote_cluster_client
  persistence:
    enabled: true
    storageClass: longhorn
    size: 20Gi
  opensearchJavaOpts: "-Xms1g -Xmx1g"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  extraEnvs:
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
    - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: opensearch-admin
          key: password

networkPolicy:
  enabled: true
  allowedClients:
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-processor
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-external
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-mcp
