{{- if .Values.enabled }}
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  kafka:
    replicas: {{ .Values.kafka.replicas }}
    storage:
      type: persistent-claim
      class: {{ .Values.kafka.storageClass }}
      size: {{ .Values.kafka.storageSize }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
  zookeeper:
    replicas: {{ .Values.zookeeper.replicas }}
    storage:
      type: persistent-claim
      class: {{ .Values.zookeeper.storageClass }}
      size: {{ .Values.zookeeper.storageSize }}
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
{{- if .Values.bootstrapAlias.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.bootstrapAlias.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ExternalName
  externalName: {{ printf "%s-kafka-bootstrap.%s.svc.cluster.local" .Values.name .Values.namespace }}
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
{{- end }}
{{- end }}
