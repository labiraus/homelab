{{- if .Values.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: {{ .Values.kafka.version | quote }}
    metadataVersion: {{ .Values.kafka.metadataVersion | quote }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    strimzi.io/cluster: {{ .Values.name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    class: {{ .Values.kafka.storageClass }}
    size: {{ .Values.kafka.storageSize }}
    deleteClaim: false
---
{{- if .Values.bootstrapAlias.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.bootstrapAlias.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ExternalName
  externalName: {{ printf "%s-kafka-bootstrap.%s.svc.cluster.local" .Values.name .Values.namespace }}
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
{{- end }}
{{- end }}
