namespace: minio
tenant:
  name: homelab
  image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
  rootUser: TODO_MINIO_ROOT_USER
  rootPassword: TODO_MINIO_ROOT_PASSWORD
  pools:
    name: pool-0
    servers: 2
    volumesPerServer: 2
    storage: 10Gi
    storageClassName: longhorn
  browserRedirectURL: http://minio-console.labiraus.com
exposure:
  internalGateway:
    enabled: true
    gatewayName: internal-gateway
    gatewayNamespace: ingress
    listenerName: http
    api:
      host: minio.labiraus.com
      serviceName: minio
      servicePort: 9000
    console:
      host: minio-console.labiraus.com
      serviceName: minio-console
      servicePort: 9443
