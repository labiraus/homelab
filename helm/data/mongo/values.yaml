namespace: mongodb
cluster:
  name: mongo-single
  members: 1
  version: "7.0.30"
  storageClassName: longhorn
  storageSize: 20Gi
  appUser: app
  appDatabase: app
  passwordSecretName: mongo-app-user-password
  scramSecretName: mongo-app-scram
networkPolicy:
  enabled: true
  allowedClients:
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-goapi
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-pythonapi
