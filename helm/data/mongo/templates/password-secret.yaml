{{- $existing := lookup "v1" "Secret" .Values.namespace .Values.cluster.passwordSecretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.passwordSecretName }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  password: {{- if $existing }} {{ index $existing.data "password" | b64dec | quote }} {{- else }} {{ randAlphaNum 32 | quote }} {{- end }}
