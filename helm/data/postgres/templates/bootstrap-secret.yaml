{{- $existing := lookup "v1" "Secret" .Values.namespace .Values.cluster.bootstrapSecretName -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cluster.bootstrapSecretName }}
  namespace: {{ .Values.namespace }}
type: kubernetes.io/basic-auth
stringData:
  username: {{- if $existing }} {{ index $existing.data "username" | b64dec | quote }} {{- else }} {{ .Values.cluster.owner | quote }} {{- end }}
  password: {{- if $existing }} {{ index $existing.data "password" | b64dec | quote }} {{- else }} {{ randAlphaNum 32 | quote }} {{- end }}
