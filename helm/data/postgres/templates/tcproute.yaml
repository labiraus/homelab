{{- $internalGateway := .Values.exposure.internalGateway | default (dict) -}}
{{- if ($internalGateway.enabled | default false) }}
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ $internalGateway.gatewayName | default "internal-gateway" }}
      namespace: {{ $internalGateway.gatewayNamespace | default "ingress" }}
      sectionName: {{ $internalGateway.sectionName | default "postgres" }}
  rules:
    - backendRefs:
        - name: {{ $internalGateway.serviceName | default (printf "%s-rw" .Values.cluster.name) }}
          port: {{ $internalGateway.servicePort | default 5432 }}
{{- end }}
