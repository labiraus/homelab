apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cluster.name }}
  namespace: {{ .Values.namespace }}
spec:
  instances: {{ .Values.cluster.instances }}
  imageName: {{ .Values.cluster.image }}
  {{- $roles := list }}
  {{- if .Values.worldbuilderRoles.enabled }}
  {{- $roles = concat $roles (list (dict "name" "worldbuilder_owner" "secret" .Values.worldbuilderRoles.ownerSecret "login" .Values.worldbuilderRoles.migrationLogin) (dict "name" "worldbuilder_external" "secret" .Values.worldbuilderRoles.externalSecret "login" true) (dict "name" "worldbuilder_relay" "secret" .Values.worldbuilderRoles.relaySecret "login" true)) }}
  {{- end }}
  {{- if .Values.nativeOAuthRole.enabled }}
  {{- $roles = append $roles (dict "name" "mcp_oauth_runtime" "secret" (required "nativeOAuthRole.passwordSecret is required" .Values.nativeOAuthRole.passwordSecret) "login" true) }}
  {{- end }}
  {{- if .Values.inferenceRoles.enabled }}
  {{- $roles = concat $roles (list (dict "name" "inference_owner" "secret" .Values.inferenceRoles.ownerSecret "login" .Values.inferenceRoles.migrationLogin) (dict "name" "inference_runtime" "secret" .Values.inferenceRoles.runtimeSecret "login" true)) }}
  {{- end }}
  {{- if $roles }}
  managed:
    roles:
      {{- range $role := $roles }}
      - name: {{ $role.name }}
        ensure: present
        login: {{ $role.login }}
        inherit: false
        superuser: false
        createdb: false
        createrole: false
        replication: false
        bypassrls: false
        inRoles: []
        passwordSecret:
          name: {{ required "Worldbuilder managed roles require dedicated password Secrets" $role.secret }}
      {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.cluster.storageSize }}
    storageClass: {{ .Values.cluster.storageClass }}
  bootstrap:
    initdb:
      database: {{ .Values.cluster.database }}
      owner: {{ .Values.cluster.owner }}
      secret:
        name: {{ .Values.cluster.bootstrapSecretName }}
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.backup.destinationPath }}
      endpointURL: {{ .Values.backup.endpointURL }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.backup.credentialsSecret }}
          key: accessKey
        secretAccessKey:
          name: {{ .Values.backup.credentialsSecret }}
          key: secretKey
      wal:
        compression: gzip
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  monitoring:
    enablePodMonitor: true
