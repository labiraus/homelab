namespace: data
cluster:
  name: app-db
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:16.13
  storageClass: longhorn
  storageSize: 10Gi
  bootstrapSecretName: app-db-bootstrap
  database: app
  owner: app
backup:
  destinationPath: s3://cnpg-backups/app-db
  endpointURL: http://svartalfheim:9000
  credentialsSecret: cnpg-backup-s3
networkPolicy:
  enabled: true
  allowedClients:
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-goapi
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-pythonapi
    - namespace: ingress
      podSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: internal-gateway
exposure:
  internalGateway:
    enabled: true
    gatewayName: internal-gateway
    gatewayNamespace: ingress
    sectionName: postgres
    serviceName: app-db-rw
    servicePort: 5432
