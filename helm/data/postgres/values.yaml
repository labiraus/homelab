namespace: data
cluster:
  name: app-db
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:16.13
  storageClass: longhorn
  storageSize: 10Gi
  bootstrapSecretName: app-db-bootstrap
  database: app
  owner: app
backup:
  destinationPath: s3://cnpg-backups/app-db
  endpointURL: http://svartalfheim:9000
  credentialsSecret: cnpg-backup-s3
networkPolicy:
  enabled: true
  allowedClients:
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-external
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-processor
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-orchestrator
    - namespace: homelab
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: homelab-mcp
