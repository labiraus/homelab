service:
  type: ClusterIP
  port: 3000
ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: mcp.labiraus.com
      paths:
        - path: /grafana
          pathType: PathPrefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - mcp.labiraus.com

# Existing stack defaults remain unchanged until an observed version is selected.
stack:
  chartVersion: '*'
  targetNamespace: istio-system

worldbuilderObservability:
  enabled: false
  datasourceUID: '' # Existing Prometheus datasource UID; never a URL or credential.
  externalNamespace: ''

# Enable only after observing the installed stack and storage class/capacity.
prometheusStorage:
  enabled: false
  storageClassName: ''
  size: '' # Positive whole Mi, Gi or Ti, e.g. 20Gi; choose from measured capacity.
  retention: '' # Positive whole h, d or w, e.g. 15d; choose from measured ingestion.
