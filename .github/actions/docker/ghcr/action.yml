name: Docker GHCR
description: Build and push Docker images to GitHub Container Registry
inputs:
  dockerfile:
    description: "The path to the dockerfile"
    required: true
  context:
    description: "The context to use for the Docker build"
    required: true
  token:
    description: "The GitHub token to use for authentication"
    required: true
  registry:
    description: "The repository name to use for the Docker image"
    required: true
  tag:
    description: "The tag to apply to the Docker image"
    required: true
  build-args:
    description: "Array of build args to be used in the Docker build"
    required: false

runs:
  using: "composite"
  steps:
    - # Setting up Docker Buildx with docker-container driver is required
      # at the moment to be able to use a subdirectory with Git context
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - # Login to GitHub Container Registry
      name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - # Build and Publish Docker images
      name: Build and Publish Docker images
      uses: docker/build-push-action@v6
      with:
        # defaultContext is the root of the repo
        context: "${{ inputs.context }}"
        file: "${{ inputs.dockerfile }}"
        push: true
        tags: |
          ghcr.io/labiraus/homelab/${{ inputs.registry }}:${{ inputs.tag }}
          ghcr.io/labiraus/homelab/${{ inputs.registry }}:${{ github.sha }}
        # cache-from and cache-to are used to cache the layers of the Docker image
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          ${{ inputs.build-args }}
