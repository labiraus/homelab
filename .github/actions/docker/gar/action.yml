name: Docker GAR
description: Build and push Docker images to Google Artifact Registry
inputs:
  dockerfile:
    description: 'The path to the dockerfile'
    required: true
  context:
    description: 'The context to use for the Docker build'
    required: true
  registry:
    description: 'The repository name to use for the Docker image'
    required: true
  tag:
    description: 'The tag to apply to the Docker image'
    required: true
  region:
    description: Google Artifact Registry region
    required: true
  project_id:
    description: GCP project ID
    required: true
  service_account:
    description: GCP Service Account with permissions to write to GAR
    required: true
  workload_identity_provider:
    description: GCP Workload Identity Provider
    required: true
  project_number:
    description: GCP Project Number
    required: true
  build-args:
    description: 'Array of build args to be used in the Docker build'
    required: false

runs:
  using: "composite"
  steps:
    -
      # Setting up Docker Buildx with docker-container driver is required
      # at the moment to be able to use a subdirectory with Git context
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - 
      # Workload Identity Authentication
      name: Create Google Cloud Authentication File
      id: google-auth
      uses: 'google-github-actions/auth@v2'
      with:
        token_format: 'access_token'
        access_token_lifetime: 300s
        workload_identity_provider: "projects/${{ inputs.project_number }}/locations/global/workloadIdentityPools/github-pool-${{ inputs.workload_identity_provider }}/providers/github-pool-provider-${{ inputs.workload_identity_provider }}"
        service_account: "${{ inputs.service_account }}"
        create_credentials_file: true

    - 
      # Login to Artifact Registry
      name: Docker Auth
      id: docker-auth
      uses: docker/login-action@v3.0.0
      with:
        username: 'oauth2accesstoken'
        password: '${{ steps.google-auth.outputs.access_token }}'
        registry: '${{ inputs.region }}-docker.pkg.dev'

    - 
      # Build and Publish Docker images
      name: Build and Publish Docker images
      uses: docker/build-push-action@v6
      with:
        # defaultContext is the root of the repo
        context: "${{ inputs.context }}"
        file: "${{ inputs.dockerfile }}"
        push: true
        tags: |
          ${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.registry }}/${{ inputs.registry }}:${{ inputs.tag }}
          ${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.registry }}/${{ inputs.registry }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          ${{ inputs.build-args }}
