name: Helm OCI GHCR
description: Package and push Helm chart to OCI registry (GHCR) for Flux HelmRelease
inputs:
  chart:
    description: The path to the helm chart (relative under helm/)
    required: true
  token:
    description: The GitHub token to use for authentication
    required: true
  tag:
    description: The version to set in Chart.yaml (e.g. git sha, semver)
    required: true
  app-version:
    description: Optional appVersion to stamp into Chart.yaml. If omitted, preserve the latest published appVersion for this series.
    required: false
  values:
    description: Optional overlay values file name inside the chart dir (e.g. values-single.yaml)
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Helm
      uses: azure/setup-helm@v4.2.0

    - name: Login to GHCR (Helm OCI)
      shell: bash
      run: |
        echo "${{ inputs.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Resolve chart paths
      shell: bash
      run: |
        echo "CHART_DIR=${{ github.workspace }}/helm/${{ inputs.chart }}" >> $GITHUB_ENV
        echo "CHART_NAME=$(basename '${{ inputs.chart }}')" >> $GITHUB_ENV
        echo "SHOULD_PUSH=true" >> $GITHUB_ENV

    - name: Resolve chart and app versions
      shell: bash
      run: |
        TAG="${{ inputs.tag }}"
        RUN_ID="${{ github.run_id }}"
        SERIES_PREFIX=""

        if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
          CHART_VER="$TAG"
        else
          SAFE_TAG="$(echo "$TAG" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^0-9a-z.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
          [[ -z "$SAFE_TAG" ]] && SAFE_TAG="build"
          SERIES_PREFIX="0.0.0-${SAFE_TAG}."
          CHART_VER="${SERIES_PREFIX}${RUN_ID}"
        fi

        CURRENT_APP_VERSION="$(
          awk -F': ' '/^appVersion:/{print $2; exit}' "${CHART_DIR}/Chart.yaml" \
            | tr -d '"' || true
        )"

        TAGS_URL="https://ghcr.io/v2/${{ github.repository }}/charts/${CHART_NAME}/tags/list"
        TAGS="$(
          curl -fsSL -u "${{ github.actor }}:${{ inputs.token }}" "$TAGS_URL" \
            | jq -r '.tags[]?' || true
        )"
        if [[ -n "${SERIES_PREFIX}" ]]; then
          TAGS="$(printf '%s\n' "$TAGS" | awk -v p="$SERIES_PREFIX" 'index($0,p)==1')"
        fi

        LATEST_TAG="$(printf '%s\n' "$TAGS" | sed '/^$/d' | sort -V | tail -n1)"
        LATEST_APP_VERSION=""
        if [[ -n "$LATEST_TAG" ]]; then
          CHART_REF="oci://ghcr.io/${{ github.repository }}/charts/${CHART_NAME}"
          LATEST_APP_VERSION="$(
            helm show chart "$CHART_REF" --version "$LATEST_TAG" \
              | awk -F': ' '/^appVersion:/{print $2; exit}' \
              | tr -d '"' || true
          )"
        fi

        APP_VERSION_INPUT="${{ inputs.app-version }}"
        APP_VERSION="$APP_VERSION_INPUT"
        if [[ -z "$APP_VERSION" ]]; then
          APP_VERSION="$LATEST_APP_VERSION"
        fi
        if [[ -z "$APP_VERSION" ]]; then
          APP_VERSION="$CURRENT_APP_VERSION"
        fi

        echo "CHART_VER=${CHART_VER}" >> "$GITHUB_ENV"
        echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
        echo "SERIES_PREFIX=${SERIES_PREFIX}" >> "$GITHUB_ENV"
        echo "LATEST_TAG=${LATEST_TAG}" >> "$GITHUB_ENV"
        echo "LATEST_APP_VERSION=${LATEST_APP_VERSION}" >> "$GITHUB_ENV"
        echo "Chart version set to: ${CHART_VER}"
        echo "Chart appVersion set to: ${APP_VERSION}"

    - name: Get chart dependencies
      shell: bash
      run: |
        helm dependency update "${CHART_DIR}"

    - name: Merge values overlay into values.yaml (optional)
      shell: bash
      run: |
        if [[ -n "${{ inputs.values }}" ]]; then
          BASE="${CHART_DIR}/values.yaml"
          OVER="${CHART_DIR}/${{ inputs.values }}"
          if [[ ! -f "$OVER" ]]; then
            echo "Overlay values file not found: $OVER" >&2
            exit 1
          fi

          # Requires yq v4 (mikefarah/yq). Install if missing.
          if ! command -v yq >/dev/null 2>&1; then
            echo "yq not found; installing..."
            YQ_VER="v4.44.3"
            curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64" -o /usr/local/bin/yq
            chmod +x /usr/local/bin/yq
          fi

          TMP="$(mktemp)"
          # Deep-merge maps; arrays replaced (Helm-like)
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' "$BASE" "$OVER" > "$TMP"
          yq eval '.' "$TMP" >/dev/null
          mv "$TMP" "$BASE"
        fi

    - name: Stamp Chart.yaml version + appVersion
      shell: bash
      run: |
        # Requires yq (installed above if overlay used; install if not)
        if ! command -v yq >/dev/null 2>&1; then
          echo "yq not found; installing..."
          YQ_VER="v4.44.3"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VER}/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
        fi

        yq -i ".version = \"${CHART_VER}\"" "${CHART_DIR}/Chart.yaml"
        yq -i ".appVersion = \"${APP_VERSION}\"" "${CHART_DIR}/Chart.yaml"

    - name: Report latest published app version for this series
      shell: bash
      run: |
        if [[ -n "$LATEST_TAG" ]]; then
          echo "Latest tag in GHCR: ${LATEST_TAG}"
          echo "Latest chart appVersion: ${LATEST_APP_VERSION}"
        else
          echo "No existing tag found in GHCR for this chart series."
        fi

    - name: Package chart
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/dist"
        helm package "${CHART_DIR}" --destination "${{ github.workspace }}/dist"

    - name: Check if chart tag already exists in GHCR
      shell: bash
      run: |
        set -euo pipefail

        CHART_REF="oci://ghcr.io/${{ github.repository }}/charts/${CHART_NAME}"
        if helm show chart "$CHART_REF" --version "${CHART_VER}" >/dev/null 2>&1; then
          echo "CHART_ALREADY_EXISTS=true" >> "$GITHUB_ENV"
          echo "Chart already exists in GHCR, skipping push: ${CHART_REF}:${CHART_VER}"
        else
          echo "CHART_ALREADY_EXISTS=false" >> "$GITHUB_ENV"
          echo "Chart tag not found in GHCR, will push: ${CHART_REF}:${CHART_VER}"
        fi

    - name: Push chart to GHCR OCI
      if: env.CHART_ALREADY_EXISTS != 'true'
      shell: bash
      run: |
        # Convention: publish to ghcr.io/<owner>/<repo>/charts
        helm push "${{ github.workspace }}/dist/"*.tgz "oci://ghcr.io/${{ github.repository }}/charts"

    - name: Print pushed chart reference
      if: env.CHART_ALREADY_EXISTS != 'true'
      shell: bash
      run: |
        echo "Pushed: oci://ghcr.io/${{ github.repository }}/charts/${CHART_NAME}:${CHART_VER}"

    - name: Report existing chart tag
      if: env.CHART_ALREADY_EXISTS == 'true'
      shell: bash
      run: |
        echo "Skipped publish for ${CHART_NAME}: tag already exists oci://ghcr.io/${{ github.repository }}/charts/${CHART_NAME}:${CHART_VER}"
