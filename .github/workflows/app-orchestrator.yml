name: App Orchestrator CI/CD
on:
  repository_dispatch:
    types: [docker-build]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to build
        required: false
        type: string
      trigger_reason:
        description: Why this workflow was invoked
        required: false
        type: string
  push:
    paths:
      - "apps/orchestrator/**"
      - "apps/pkg/**"
      - "sql/worldbuilder/**"
      - "sql/mcp/**"
      - "scripts/worldbuilder/**"
      - ".github/actions/docker/**"
      - ".github/workflows/app-orchestrator.yml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency: ci-orchestrator-docker-pipeline

jobs:
  platform-acceptance:
    uses: ./.github/workflows/platform-acceptance.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}

  storage-acceptance:
    uses: ./.github/workflows/storage-acceptance.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}

  test:
    name: "Orchestrator Test"
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'no-ci') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('./apps/orchestrator/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: unit test
        run: go test ./...
        working-directory: apps/orchestrator

      - name: Canon migrations and generation startup compatibility
        run: bash scripts/worldbuilder/test-postgres.sh

      - name: Three-node JetStream quorum and recovery
        run: bash scripts/worldbuilder/test-jetstream.sh

  ghcr:
    needs: [test, storage-acceptance, platform-acceptance]
    name: "Orchestrator Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Build to GHCR
        id: build
        uses: ./.github/actions/docker/ghcr
        with:
          dockerfile: ./apps/orchestrator/dockerfile
          context: ./apps
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: orchestrator
          tag: uat

      - name: Publish Helm chart to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: apps/orchestrator
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat
          app-version: ${{ steps.build.outputs.image_tag }}
