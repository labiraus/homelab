name: App UI CI/CD
on:
  repository_dispatch:
    types: [docker-build]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to build
        required: false
        type: string
      trigger_reason:
        description: Why this workflow was invoked
        required: false
        type: string
  push:
    paths:
      - "apps/ui/**"
      - ".github/actions/docker/**"
      - ".github/workflows/app-ui.yml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency: ci-ui-docker-pipeline

jobs:
  platform-acceptance:
    uses: ./.github/workflows/platform-acceptance.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}

  test:
    name: "UI Test"
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'no-ci') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Cache Node.js modules
        id: cache-node
        uses: actions/cache@v5
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/ui

      - name: Run unit tests
        run: npm run build && npm test
        working-directory: apps/ui

      - name: Set up Go for disposable canon acceptance
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium
        working-directory: apps/ui

      - name: Responsive workspace and design acceptance
        run: npm run test:workspace
        working-directory: apps/ui
        env:
          WORLDBUILDER_BROWSER_ARTIFACTS: ${{ runner.temp }}/worldbuilder-workspace-artifacts

      - name: Production PWA lifecycle and responsive screenshots
        run: npm run test:pwa
        working-directory: apps/ui
        env:
          WORLDBUILDER_BROWSER_ARTIFACTS: ${{ runner.temp }}/worldbuilder-pwa-artifacts

      - name: Retain PWA screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldbuilder-pwa-evidence
          path: ${{ runner.temp }}/worldbuilder-pwa-artifacts
          if-no-files-found: ignore

      - name: Retain failed workspace browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worldbuilder-workspace-failure
          path: ${{ runner.temp }}/worldbuilder-workspace-artifacts
          if-no-files-found: ignore

      - name: Browser acceptance against disposable PostgreSQL
        run: bash scripts/worldbuilder/test-postgres.sh
        env:
          WORLDBUILDER_BROWSER_TEST: '1'
          WORLDBUILDER_BROWSER_ARTIFACTS: ${{ runner.temp }}/worldbuilder-api-browser-artifacts

      - name: Retain failed PostgreSQL API browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worldbuilder-api-browser-failure
          path: ${{ runner.temp }}/worldbuilder-api-browser-artifacts
          if-no-files-found: ignore

      - name: Check dependency advisories
        run: npm audit --audit-level=high
        working-directory: apps/ui

  ghcr:
    needs: [test, platform-acceptance]
    name: "UI Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Build to GHCR
        id: build
        uses: ./.github/actions/docker/ghcr
        with:
          dockerfile: ./apps/ui/dockerfile
          context: ./apps/ui
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: ui
          tag: uat

      - name: Verify static image before chart publication
        env:
          UI_IMAGE: ghcr.io/labiraus/homelab/ui:${{ steps.build.outputs.image_tag }}
        run: python3 apps/ui/browser/image-smoke.py "$UI_IMAGE"

      - name: Publish Helm chart to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: apps/ui
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat
          app-version: ${{ steps.build.outputs.image_tag }}
