name: Offline Platform Acceptance
on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: false
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to validate
        type: string
        required: false
  push:
    paths:
      - 'scripts/worldbuilder/**'
      - 'scripts/storage/requirements.txt'
      - 'ansible/roles/seaweedfs/**'
      - 'values/velero*.yaml'
      - '.github/workflows/platform-acceptance.yml'
  pull_request:
    paths:
      - 'scripts/worldbuilder/**'
      - 'scripts/storage/requirements.txt'
      - 'ansible/roles/seaweedfs/**'
      - 'values/velero*.yaml'
      - 'helm/**'
      - '.github/workflows/platform-acceptance.yml'
permissions:
  contents: read
jobs:
  canon-index:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false
      - name: Refuse unowned canon-index fixtures
        run: python3 scripts/worldbuilder/test-canon-index-unit.py
      - name: Verify embedding contract refusals and full-text batching
        working-directory: apps/pkg/canonsearch
        run: go test -race -count=1 ./...
      - name: Verify actual canon relay, discovery and index recovery
        run: python3 scripts/worldbuilder/test-canon-index.py "$RUNNER_TEMP/canon-index"
        env:
          DOCKER_HOST: tcp://127.0.0.1:1
          WORLDBUILDER_TEST_DATABASE_URL: postgres://refuse-existing.invalid/canon
          WORLDBUILDER_TEST_NATS_URL: nats://refuse-existing.invalid:4222
          WORLDBUILDER_TEST_OPENSEARCH_URL: http://refuse-existing.invalid:9200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-canon-index-result
          path: |
            ${{ runner.temp }}/canon-index/index-result.json
            ${{ runner.temp }}/canon-index/*.log
          retention-days: 7
  api-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false
      - uses: azure/setup-helm@v4.2.0
        with:
          version: 'v4.3.0'
      - name: Install structural validation dependencies
        run: python3 -m pip install -r scripts/worldbuilder/requirements.txt
      - name: Validate source against a disposable API server
        run: bash scripts/worldbuilder/test-platform.sh "$RUNNER_TEMP/platform-acceptance"
      - name: Retain public schema and synthetic render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-platform-evidence
          path: |
            ${{ runner.temp }}/platform-acceptance/schemas/*.yaml
            ${{ runner.temp }}/platform-acceptance/schemas/sources.json
            ${{ runner.temp }}/platform-acceptance/renders/*.template
            ${{ runner.temp }}/platform-acceptance/renders/*-enabled.yaml
            ${{ runner.temp }}/platform-acceptance/renders/*.stderr
            ${{ runner.temp }}/platform-acceptance/renders/*.lint
            ${{ runner.temp }}/platform-acceptance/renders/observability/*.json
            ${{ runner.temp }}/platform-acceptance/renders/observability/*.yaml
            ${{ runner.temp }}/platform-acceptance/renders/observability/*.upstream
            ${{ runner.temp }}/platform-acceptance/assets/assets.json
          retention-days: 7
  controllers:
    needs: api-server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false
      - uses: azure/setup-helm@v4.2.0
        with:
          version: 'v4.3.0'
      - uses: actions/download-artifact@v4
        with:
          name: offline-platform-evidence
          path: ${{ runner.temp }}/platform-evidence
      - name: Install test dependencies and verify transport refusal cases
        run: |
          python3 -m pip install -r scripts/worldbuilder/requirements.txt
          python3 scripts/worldbuilder/test-docker-exec.py
      - name: Emit real external metrics from test-only handlers
        working-directory: apps/external
        run: WORLDBUILDER_METRICS_FIXTURE="$RUNNER_TEMP/worldbuilder-metrics.txt" go test -count=1 -run '^TestWorldbuilderObservabilityFixture$' .
      - name: Verify real admission, monitor reconciliation and recovery
        run: python3 scripts/worldbuilder/test-controllers.py "$RUNNER_TEMP/controller-acceptance" "$RUNNER_TEMP/platform-evidence/renders/observability" "$RUNNER_TEMP/worldbuilder-metrics.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-controller-result
          path: |
            ${{ runner.temp }}/controller-acceptance/*.json
            ${{ runner.temp }}/controller-acceptance/*.log
            ${{ runner.temp }}/controller-acceptance/stack-values.yaml
            ${{ runner.temp }}/controller-acceptance/stack.yaml
          retention-days: 7
  tsdb-restore:
    needs: api-server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false
      - uses: azure/setup-helm@v4.2.0
        with:
          version: 'v4.3.0'
      - uses: actions/download-artifact@v4
        with:
          name: offline-platform-evidence
          path: ${{ runner.temp }}/platform-evidence
      - name: Install and verify snapshot and transport refusal checks
        run: |
          python3 -m pip install -r scripts/worldbuilder/requirements.txt
          python3 scripts/worldbuilder/test-docker-exec.py
          python3 scripts/worldbuilder/test-tsdb-unit.py
      - name: Emit real external metrics from test-only handlers
        working-directory: apps/external
        run: WORLDBUILDER_METRICS_FIXTURE="$RUNNER_TEMP/worldbuilder-metrics.txt" go test -count=1 -run '^TestWorldbuilderObservabilityFixture$' .
      - name: Verify persistent TSDB and snapshot recovery after source loss
        run: python3 scripts/worldbuilder/test-tsdb.py "$RUNNER_TEMP/tsdb-acceptance" "$RUNNER_TEMP/platform-evidence/renders/observability" "$RUNNER_TEMP/worldbuilder-metrics.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-tsdb-result
          path: |
            ${{ runner.temp }}/tsdb-acceptance/*.json
            ${{ runner.temp }}/tsdb-acceptance/*.log
            ${{ runner.temp }}/tsdb-acceptance/stack-values.yaml
            ${{ runner.temp }}/tsdb-acceptance/stack.yaml
          retention-days: 7
  backup-restore:
    needs: api-server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.2.0
        with:
          version: 'v4.3.0'
      - uses: actions/download-artifact@v4
        with:
          name: offline-platform-evidence
          path: ${{ runner.temp }}/platform-evidence
      - name: Install backup fixture dependencies
        run: |
          python3 -m pip install -r scripts/worldbuilder/requirements.txt -r scripts/storage/requirements.txt
          command -v psql || sudo apt-get install -y postgresql-client
          python3 scripts/worldbuilder/test-docker-exec.py
          python3 scripts/worldbuilder/test-backups-unit.py
      - name: Verify CNPG physical backup, WAL and point-in-time restore
        run: python3 scripts/worldbuilder/test-backups.py "$RUNNER_TEMP/backup-acceptance" "$RUNNER_TEMP/platform-evidence/schemas"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-backup-result
          path: |
            ${{ runner.temp }}/backup-acceptance/*.json
            ${{ runner.temp }}/backup-acceptance/*.log
            ${{ runner.temp }}/backup-acceptance/operator.yaml
            ${{ runner.temp }}/backup-acceptance/cluster.yaml
            ${{ runner.temp }}/backup-acceptance/postgres-inputs.yaml
          retention-days: 7
  velero-restore:
    needs: api-server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.2.0
        with:
          version: 'v4.3.0'
      - name: Install and test recovery fixture dependencies
        run: |
          python3 -m pip install -r scripts/worldbuilder/requirements.txt -r scripts/storage/requirements.txt
          python3 scripts/worldbuilder/test-docker-exec.py
          python3 scripts/worldbuilder/test-velero-unit.py
      - name: Verify Velero file and resource restore after source loss
        run: python3 scripts/worldbuilder/test-velero.py "$RUNNER_TEMP/velero-acceptance"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-velero-result
          path: |
            ${{ runner.temp }}/velero-acceptance/*.json
            ${{ runner.temp }}/velero-acceptance/*.log
            ${{ runner.temp }}/velero-acceptance/velero-values.yaml
            ${{ runner.temp }}/velero-acceptance/velero.yaml
          retention-days: 7
  mesh:
    needs: api-server
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.2.0
        with:
          version: 'v4.3.0'
      - uses: actions/download-artifact@v4
        with:
          name: offline-platform-evidence
          path: ${{ runner.temp }}/platform-evidence
      - name: Install and verify disposable transport dependencies
        run: |
          python3 -m pip install -r scripts/worldbuilder/requirements.txt
          python3 scripts/worldbuilder/test-docker-exec.py
          python3 scripts/worldbuilder/test-mesh-artifacts.py
      - name: Verify source network, mesh identity and authenticated Gateway boundaries
        run: python3 scripts/worldbuilder/test-mesh.py "$RUNNER_TEMP/mesh-acceptance" "$RUNNER_TEMP/platform-evidence/schemas"
      - name: Refuse private material in retained mesh artifacts
        id: mesh-artifacts-safe
        if: always()
        run: python3 scripts/worldbuilder/test-mesh.py --check-artifacts "$RUNNER_TEMP/mesh-acceptance"
      - uses: actions/upload-artifact@v4
        if: always() && steps.mesh-artifacts-safe.outcome == 'success'
        with:
          name: offline-mesh-result
          path: |
            ${{ runner.temp }}/mesh-acceptance/*.json
            ${{ runner.temp }}/mesh-acceptance/*.log
            ${{ runner.temp }}/mesh-acceptance/*.yaml
          retention-days: 7
  observability:
    needs: api-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: offline-platform-evidence
          path: ${{ runner.temp }}/platform-evidence
      - name: Install test dependencies
        run: python3 -m pip install -r scripts/worldbuilder/requirements.txt
      - name: Emit real external metrics from test-only handlers
        working-directory: apps/external
        run: WORLDBUILDER_METRICS_FIXTURE="$RUNNER_TEMP/worldbuilder-metrics.txt" go test -count=1 -run '^TestWorldbuilderObservabilityFixture$' .
      - name: Verify disposable Prometheus and Grafana provisioning
        run: python3 scripts/worldbuilder/test-observability.py "$RUNNER_TEMP/platform-evidence/renders/observability" "$RUNNER_TEMP/worldbuilder-metrics.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-observability-result
          path: |
            ${{ runner.temp }}/platform-evidence/renders/observability/runtime-result.json
            ${{ runner.temp }}/platform-evidence/renders/observability/runtime/*.log
            ${{ runner.temp }}/platform-evidence/renders/observability/runtime/queries.yaml
          retention-days: 7
