name: App Processor CI/CD
on:
  repository_dispatch:
    types: [docker-build]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to build
        required: false
        type: string
      trigger_reason:
        description: Why this workflow was invoked
        required: false
        type: string
  push:
    paths:
      - "apps/processor/**"
      - ".github/actions/docker/**"
      - ".github/workflows/app-processor.yml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency: ci-processor-docker-pipeline

jobs:
  platform-acceptance:
    uses: ./.github/workflows/platform-acceptance.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}

  storage-acceptance:
    uses: ./.github/workflows/storage-acceptance.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}

  test:
    name: "Processor Test"
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'no-ci') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/processor

      - name: Run unit tests
        run: npm run build && npm test
        working-directory: apps/processor

      - name: Check dependency advisories
        run: npm audit --audit-level=moderate
        working-directory: apps/processor

      - name: Verify document ownership and worker-loss recovery
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client socat
          bash scripts/worldbuilder/test-document-claims.sh

  ghcr:
    needs: [test, storage-acceptance, platform-acceptance]
    name: "Processor Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Build to GHCR
        id: build
        uses: ./.github/actions/docker/ghcr
        with:
          dockerfile: ./apps/processor/dockerfile
          context: ./apps/processor
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: processor
          tag: uat

      - name: Verify locked runtime image before chart publication
        env:
          PROCESSOR_IMAGE: ghcr.io/labiraus/homelab/processor:${{ steps.build.outputs.image_tag }}
        run: |
          expected_lock_sha=$(sha256sum apps/processor/package-lock.json | cut -d' ' -f1)
          docker run --rm -i --network none --env EXPECTED_LOCK_SHA="$expected_lock_sha" --entrypoint node "$PROCESSOR_IMAGE" --input-type=module < apps/processor/test/image-smoke.mjs

      - name: Publish Helm chart to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: apps/processor
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat
          app-version: ${{ steps.build.outputs.image_tag }}
