name: Helm Istio CI/CD
on:
  repository_dispatch:
    types: [helm-build]
  push:
    paths:
      - helm/infra/flux-istio/**/*
      - ".github/actions/helm/**"
      - ".github/workflows/helm-flux-istio.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-default:
    name: "Istio Helm Test Default"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test Default
        uses: ./.github/actions/helm/test
        with:
          chart: infra/flux-istio
          values: values.yaml

  test-ghcr:
    name: "Istio Helm Test GHCR"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test GHCR
        uses: ./.github/actions/helm/test
        with:
          chart: infra/flux-istio
          values: values-ghcr.yaml

  test-ecr:
    name: "Istio Helm Test ECR"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci') && vars.USE_ECR != 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test ECR
        uses: ./.github/actions/helm/test
        with:
          chart: infra/flux-istio
          values: values-ecr.yaml

  ghcr:
    name: "Istio Helm Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Build to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: infra/flux-istio
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat

  ecr:
    name: "Istio Helm Build to ECR"
    runs-on: ubuntu-latest
    environment: uat
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci') && vars.USE_ECR != 'false'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Build to ECR
        uses: ./.github/actions/helm/ecr
        with:
          chart: infra/flux-istio
          aws-region: ${{ vars.AWS_REGION}}
          role-to-assume: ${{ vars.OIDC_BUILD_ROLE}}
          registry: k8s-quickstart-ecr/helm-flux-istio
          values: values-ecr.yaml
          tag: uat
