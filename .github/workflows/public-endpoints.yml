name: Public Endpoint Validation

on:
  push:
    branches: [main, dev]
    paths:
      - scripts/validation/**
      - .github/workflows/public-endpoints.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - Helm All CI/CD
      - App MCP CI/CD
      - App External CI/CD
      - App UI CI/CD
      - App Processor CI/CD
      - App Orchestrator CI/CD
    types: [completed]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: public-endpoints
  cancel-in-progress: false

jobs:
  public-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Use trusted default-branch code for workflow_run, with no cluster or user credentials.
      - uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Test response classification and TLS failure handling
        run: python3 -m unittest discover -s scripts/validation -p 'test_*.py' -v
      - name: Wait for public endpoint availability
        env:
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          args=()
          if [[ "$UPSTREAM_WORKFLOW" == "App MCP CI/CD" ]]; then
            args+=(--expected-mcp-version "0.0.0-uat.${UPSTREAM_RUN_ID}")
          fi
          python3 scripts/validation/public-endpoints.py --attempts 10 --interval 30 --output public-endpoints.json "${args[@]}"
      - name: Retain sanitized connectivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-endpoints-${{ github.run_id }}
          path: public-endpoints.json
          retention-days: 14
          if-no-files-found: warn
