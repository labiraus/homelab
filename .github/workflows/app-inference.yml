name: App Inference CI/CD
on:
  repository_dispatch:
    types: [docker-build]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to build
        required: false
        type: string
      trigger_reason:
        description: Why this workflow was invoked
        required: false
        type: string
  push:
    paths:
      - "apps/inference/**"
      - "sql/inference/**"
      - "helm/infra/inference/**"
      - "scripts/inference/**"
      - "scripts/worldbuilder/**"
      - "apps/pkg/**"
      - ".github/actions/docker/**"
      - ".github/workflows/app-inference.yml"

permissions:
  contents: read
  packages: write
  id-token: write

concurrency: ci-inference-docker-pipeline

jobs:
  platform-acceptance:
    uses: ./.github/workflows/platform-acceptance.yml
    with:
      commit_sha: ${{ github.event.inputs.commit_sha || github.sha }}

  test:
    name: "Inference Test"
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'no-ci') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.6'
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('./apps/inference/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: unit test
        run: go test ./...
        working-directory: apps/inference

      - name: Inference disposable accounting acceptance
        run: bash scripts/inference/test-postgres.sh

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Install manifest parser
        run: python3 -m pip install PyYAML==6.0.3

      - name: Inference manifest tests
        run: python3 scripts/inference/test-manifests.py

      - name: Verify the pinned credential helper can execute in its runtime
        run: |
          docker build -f apps/inference/credentials/dockerfile -t inference-credentials:test apps/inference/credentials
          test "$(docker run --rm --network none inference-credentials:test version)" = "1.8.5"

  ghcr:
    needs: [test, platform-acceptance]
    name: "Inference Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          ref: ${{ github.event.inputs.commit_sha || github.sha }}

      - name: Build to GHCR
        id: build
        uses: ./.github/actions/docker/ghcr
        with:
          dockerfile: ./apps/inference/dockerfile
          context: ./apps
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: inference
          tag: uat

      - name: Publish credential helper
        uses: ./.github/actions/docker/ghcr
        with:
          dockerfile: ./apps/inference/credentials/dockerfile
          context: ./apps/inference/credentials
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: inference-credentials
          tag: uat

      - name: Publish Helm chart to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: infra/inference
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat
          app-version: ${{ steps.build.outputs.image_tag }}
