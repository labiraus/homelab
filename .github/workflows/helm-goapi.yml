name: Helm GoApi CI/CD
on:
  workflow_dispatch:
  repository_dispatch:
    types: [helm-build]
  push:
    paths:
      - helm/apps/goapi/**/*
      - helm/libraries/**/*
      - ".github/actions/helm/**"
      - ".github/workflows/helm-goapi.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-default:
    name: "GoApi Helm Test"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test Default
        uses: ./.github/actions/helm/test
        with:
          chart: apps/goapi
          values: values.yaml

  test-ghcr:
    name: "GoApi Helm Test GHCR"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test GHCR
        uses: ./.github/actions/helm/test
        with:
          chart: apps/goapi
          values: values-ghcr.yaml

  test-ecr:
    name: "GoApi Helm Test ECR"
    runs-on: ubuntu-latest
    environment: uat
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci') && (vars.USE_ECR == 'true' || vars.USE_ECR == '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test ECR
        uses: ./.github/actions/helm/test
        with:
          chart: apps/goapi
          values: values-ecr.yaml

  ghcr:
    name: "GoApi Helm Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Build to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: apps/goapi
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat

  ecr:
    name: "GoApi Helm Build to ECR"
    runs-on: ubuntu-latest
    environment: uat
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci') && (vars.USE_ECR == 'true' || vars.USE_ECR == '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Build to ECR
        uses: ./.github/actions/helm/ecr
        with:
          chart: apps/goapi
          aws-region: ${{ vars.AWS_REGION}}
          role-to-assume: ${{ vars.OIDC_BUILD_ROLE}}
          registry: k8s-quickstart-ecr/helm-goapi
          image_repository: k8s-quickstart-ecr/goapi
          values: values-ecr.yaml
          tag: uat
