name: Helm Flux Bootstrap CI/CD
on:
  repository_dispatch:
    types: [helm-build]
  push:
    paths:
      - helm/infra/flux-bootstrap/**/*
      - ".github/actions/helm/**"
      - ".github/workflows/helm-flux-bootstrap.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test-default:
    name: "Flux Bootstrap Helm Test Default"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test Default
        uses: ./.github/actions/helm/test
        with:
          chart: infra/flux-bootstrap
          values: values.yaml

  test-ghcr:
    name: "Flux Bootstrap Helm Test GHCR"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Test GHCR
        uses: ./.github/actions/helm/test
        with:
          chart: infra/flux-bootstrap
          values: values-ghcr.yaml

  ghcr:
    name: "Flux Bootstrap Helm Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
    
      - name: Build to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: infra/flux-bootstrap
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat