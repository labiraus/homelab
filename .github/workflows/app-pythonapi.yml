name: App PythonApi CI/CD
on:
  repository_dispatch:
    types: [docker-build]
  push:
    paths:
      - "apps/pythonapi/**"
      - ".github/actions/docker/**"
      - ".github/workflows/app-pythonapi.yml"

# This section defines the permissions given to the workflow through the secrets.GITHUB_TOKEN
permissions:
  contents: read
  packages: write
  id-token: write

concurrency: ci-pythonapi-docker-pipeline

jobs:
  test:
    name: "PythonApi Test"
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4.1.1

      - 
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ./apps/pythonapi/requirements.txt

      - 
        name: Install dependencies
        run: python -m pip install --requirement ./apps/pythonapi/requirements.txt

      -
        name: Unit test
        working-directory: ./apps/pythonapi
        run: python -m unittest discover -s tests -p '*test.py'

  ghcr:
    name: "PythonApi Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')

    steps:
      -
        name: Checkout
        uses: actions/checkout@v4.1.1
    
      - name: Build to GHCR
        uses: ./.github/actions/docker/ghcr
        with:
          dockerfile: ./apps/pythonapi/dockerfile
          context: ./apps
          token: ${{ secrets.GITHUB_TOKEN }}
          registry: pythonapi
          tag: uat

      - name: Publish Helm chart to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: apps/pythonapi
          token: ${{ secrets.GITHUB_TOKEN }}
          values: values-ghcr.yaml
          tag: uat
