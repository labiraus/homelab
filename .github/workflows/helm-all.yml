name: Helm All CI/CD
on:
  repository_dispatch:
    types: [helm-build]
  push:
    paths:
      - helm/**/*
      - ".github/actions/helm/**"
      - "scripts/build/build_helm_matrix.py"
      - ".github/workflows/helm-all.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  discover:
    name: Discover Helm Charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ghcr_matrix: ${{ steps.matrix.outputs.ghcr_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Build chart matrix
        id: matrix
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/build/build_helm_matrix.py

  test-default:
    name: "${{ matrix.chart }} Helm Test Default"
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Test Default
        uses: ./.github/actions/helm/test
        with:
          chart: ${{ matrix.chart }}
          values: values.yaml

  test-ghcr:
    name: "${{ matrix.chart }} Helm Test GHCR"
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Test GHCR
        uses: ./.github/actions/helm/test
        with:
          chart: ${{ matrix.chart }}
          values: ${{ matrix.ghcr_values }}

  ghcr:
    name: "${{ matrix.chart }} Helm Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    needs: discover
    if: needs.discover.outputs.ghcr_matrix != '[]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.ghcr_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Build to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: ${{ matrix.chart }}
          token: ${{ secrets.GITHUB_TOKEN }}
          values: ${{ matrix.ghcr_values }}
          tag: uat
