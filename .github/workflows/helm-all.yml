name: Helm All CI/CD
on:
  repository_dispatch:
    types: [helm-build]
  push:
    paths:
      - helm/**/*
      - ".github/actions/helm/**"
      - "scripts/build/**"
      - ".github/workflows/helm-all.yml"

permissions:
  actions: write
  contents: read
  packages: write
  id-token: write

jobs:
  discover:
    name: Discover Helm Charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ghcr_matrix: ${{ steps.matrix.outputs.ghcr_matrix }}
      app_matrix: ${{ steps.matrix.outputs.app_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Build chart matrix
        id: matrix
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 scripts/build/test-app-publish-source.py
          python3 scripts/build/build_helm_matrix.py

  platform-validation:
    name: Worldbuilder API-server acceptance
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && !contains(github.event.head_commit.message, 'no-ci')
    uses: ./.github/workflows/platform-acceptance.yml
    with:
      commit_sha: ${{ github.sha }}

  test-default:
    name: "${{ matrix.chart }} Helm Test Default"
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Test Default
        uses: ./.github/actions/helm/test
        with:
          chart: ${{ matrix.chart }}
          values: values.yaml

  test-ghcr:
    name: "${{ matrix.chart }} Helm Test GHCR"
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Test GHCR
        uses: ./.github/actions/helm/test
        with:
          chart: ${{ matrix.chart }}
          values: ${{ matrix.ghcr_values }}

  ghcr:
    name: "${{ matrix.chart }} Helm Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    needs: [discover, platform-validation]
    if: needs.discover.outputs.ghcr_matrix != '[]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.ghcr_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Build to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: ${{ matrix.chart }}
          token: ${{ secrets.GITHUB_TOKEN }}
          values: ${{ matrix.ghcr_values }}
          tag: uat

  app-ghcr:
    name: "${{ matrix.app }} App Build Pipeline"
    runs-on: ubuntu-latest
    needs: [discover, platform-validation]
    if: needs.discover.outputs.app_matrix != '[]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.app_matrix) }}
    steps:
      - name: Dispatch app workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_BRANCH: ${{ github.ref_name }}
          APP_REPOSITORY: ${{ github.repository }}
          APP_WORKFLOW: ${{ matrix.workflow }}
        shell: bash
        run: |
          # This Helm job can finish after newer app commits. The app workflow
          # runs its own complete acceptance against the revision selected here.
          current_sha=$(gh api "repos/$APP_REPOSITORY/git/ref/heads/$APP_BRANCH" --jq '.object.sha')
          gh api \
            --method POST \
            "repos/$APP_REPOSITORY/actions/workflows/$APP_WORKFLOW/dispatches" \
            -f ref="$APP_BRANCH" \
            -f inputs[commit_sha]="$current_sha" \
            -f inputs[trigger_reason]="helm-chart"
