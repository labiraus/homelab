name: Helm All CI/CD
on:
  repository_dispatch:
    types: [helm-build]
  push:
    paths:
      - helm/**/*
      - ".github/actions/helm/**"
      - ".github/workflows/helm-all.yml"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  discover:
    name: Discover Helm Charts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Build chart matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          rows=()
          while IFS= read -r chart_yaml; do
            chart_dir="${chart_yaml%/Chart.yaml}"
            chart_rel="${chart_dir#helm/}"
            chart_type="$(awk -F': ' '/^type:/{print $2}' "$chart_yaml" || true)"

            # Skip non-installable library charts.
            if [[ "$chart_type" == "library" ]]; then
              continue
            fi

            ghcr_values="values.yaml"
            if [[ -f "${chart_dir}/values-ghcr.yaml" ]]; then
              ghcr_values="values-ghcr.yaml"
            fi

            rows+=("${chart_rel}|${ghcr_values}")
          done < <(find helm -type f -name Chart.yaml | sort)

          if [[ "${#rows[@]}" -eq 0 ]]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json="$(
            printf '%s\n' "${rows[@]}" \
              | jq -R -s -c '
                  split("\n")
                  | map(select(length > 0))
                  | map(split("|"))
                  | map({
                      chart: .[0],
                      ghcr_values: .[1]
                    })
                '
          )"

          echo "matrix=${matrix_json}" >> "$GITHUB_OUTPUT"

  test-default:
    name: "${{ matrix.chart }} Helm Test Default"
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Test Default
        uses: ./.github/actions/helm/test
        with:
          chart: ${{ matrix.chart }}
          values: values.yaml

  test-ghcr:
    name: "${{ matrix.chart }} Helm Test GHCR"
    runs-on: ubuntu-latest
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Test GHCR
        uses: ./.github/actions/helm/test
        with:
          chart: ${{ matrix.chart }}
          values: ${{ matrix.ghcr_values }}

  ghcr:
    name: "${{ matrix.chart }} Helm Build to GHCR"
    runs-on: ubuntu-latest
    environment: uat
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && !contains(github.event.head_commit.message, 'no-ci')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Build to GHCR
        uses: ./.github/actions/helm/ghcr
        with:
          chart: ${{ matrix.chart }}
          token: ${{ secrets.GITHUB_TOKEN }}
          values: ${{ matrix.ghcr_values }}
          tag: uat
