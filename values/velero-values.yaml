configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: velero
      default: true
      config:
        region: us-east-1
        s3Url: https://minio.minio.svc.cluster.local:9000
        s3ForcePathStyle: "true"
        insecureSkipTLSVerify: "true"
credentials:
  useSecret: true
  existingSecret: velero-minio-credentials
deployNodeAgent: true
snapshotsEnabled: false
