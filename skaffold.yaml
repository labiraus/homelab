apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: homelab

deploy:
  helm:
    releases:
      - name: platform-metallb
        remoteChart: metallb
        repo: https://metallb.github.io/metallb
        version: 0.15.3
        namespace: metallb-system
        valuesFiles:
          - values/metallb-values.yaml
        createNamespace: true
        wait: true

      - name: platform-metallb-config
        chartPath: charts/metallb-config
        namespace: metallb-system
        createNamespace: true
        wait: true
        dependsOn:
          - platform-metallb

      - name: platform-istio-base
        remoteChart: base
        repo: https://istio-release.storage.googleapis.com/charts
        version: 1.28.0
        namespace: istio-system
        createNamespace: true
        wait: true

      - name: platform-istiod
        remoteChart: istiod
        repo: https://istio-release.storage.googleapis.com/charts
        version: 1.28.0
        namespace: istio-system
        valuesFiles:
          - values/istio-values.yaml
        createNamespace: true
        wait: true
        dependsOn:
          - platform-istio-base

      - name: platform-istio-gateway
        remoteChart: gateway
        repo: https://istio-release.storage.googleapis.com/charts
        version: 1.28.0
        namespace: istio-ingress
        valuesFiles:
          - values/istio-gateway-values.yaml
        createNamespace: true
        wait: true
        dependsOn:
          - platform-istiod

      - name: platform-istio-routing
        chartPath: charts/istio-routing
        namespace: istio-ingress
        createNamespace: true
        wait: true
        dependsOn:
          - platform-istio-gateway

      - name: platform-cert-manager
        remoteChart: cert-manager
        repo: https://charts.jetstack.io
        version: v1.19.2
        namespace: cert-manager
        valuesFiles:
          - values/cert-manager-values.yaml
        createNamespace: true
        wait: true

      - name: platform-cert-issuers
        chartPath: charts/cert-issuers
        namespace: cert-manager
        createNamespace: true
        wait: true
        dependsOn:
          - platform-cert-manager

      - name: platform-longhorn
        remoteChart: longhorn
        repo: https://charts.longhorn.io
        version: 1.10.1
        namespace: longhorn-system
        valuesFiles:
          - values/longhorn-values.yaml
        createNamespace: true
        wait: true

      - name: platform-velero
        remoteChart: velero
        repo: https://vmware-tanzu.github.io/helm-charts
        version: 11.1.0
        namespace: velero
        valuesFiles:
          - values/velero-values.yaml
        createNamespace: true
        wait: true

      - name: data-minio-operator
        remoteChart: operator
        repo: https://operator.min.io
        version: 7.1.1
        namespace: minio-operator
        createNamespace: true
        wait: true

      - name: data-minio-tenant
        chartPath: charts/minio-tenant
        namespace: minio
        createNamespace: true
        wait: true
        dependsOn:
          - data-minio-operator

      - name: data-cnpg-operator
        remoteChart: cloudnative-pg
        repo: https://cloudnative-pg.github.io/charts
        version: 0.26.1
        namespace: cnpg-system
        valuesFiles:
          - values/cnpg-values.yaml
        createNamespace: true
        wait: true

      - name: data-cnpg-cluster
        chartPath: charts/cnpg-cluster
        namespace: data
        createNamespace: true
        wait: true
        dependsOn:
          - data-cnpg-operator

      - name: data-redis
        remoteChart: redis
        repo: https://ot-container-kit.github.io/helm-charts
        version: 0.19.0
        namespace: data
        valuesFiles:
          - values/redis-values.yaml
        createNamespace: true
        wait: true

      - name: data-mongo-operator
        remoteChart: community-operator
        repo: https://mongodb.github.io/helm-charts
        version: 0.12.0
        namespace: mongodb
        valuesFiles:
          - values/mongo-values.yaml
        createNamespace: true
        wait: true

      - name: data-mongo-cluster
        chartPath: charts/mongo-cluster
        namespace: mongodb
        createNamespace: true
        wait: true
        dependsOn:
          - data-mongo-operator

      - name: apps-jobs
        chartPath: charts/jobs
        namespace: data
        createNamespace: true
        wait: true
        dependsOn:
          - data-cnpg-cluster

      - name: apps-minecraft
        remoteChart: minecraft
        repo: https://itzg.github.io/minecraft-server-charts/
        version: 4.24.0
        namespace: minecraft
        valuesFiles:
          - values/minecraft-values.yaml
        createNamespace: true
        wait: true

      - name: apps-minecraft-backup-cron
        chartPath: charts/minecraft-ops
        namespace: minecraft
        createNamespace: true
        wait: true
        dependsOn:
          - apps-minecraft

      - name: apps-static-sites
        chartPath: charts/static-sites
        namespace: static-sites
        createNamespace: true
        wait: true
        dependsOn:
          - platform-istio-gateway
          - data-minio-tenant

      - name: optional-example-local
        chartPath: charts/example-local-chart
        namespace: default
        createNamespace: true
        wait: true

      - name: optional-kafka-example
        chartPath: charts/kafka-example
        namespace: data
        createNamespace: true
        wait: true

      - name: optional-harvester
        chartPath: charts/harvester
        namespace: kubevirt
        createNamespace: true
        wait: true

      - name: optional-plex
        chartPath: charts/plex
        namespace: plex
        createNamespace: true
        wait: true
