{{- if .Values.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvester-notes
  namespace: {{ .Values.namespace }}
data:
  notes: |
    Harvester/KubeVirt workloads should run on dedicated nodes.
    Ensure virtualization extensions are enabled.
    Longhorn dependency required: {{ .Values.longhornDependency }}
    Feature gates: {{ join "," .Values.featureGates }}
{{- end }}
