model = "gpt-5.4"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[mcp_servers.homelab-mcp]
url = "https://mcp.labiraus.com/mcp"
enabled = true
ca_certificate = "/workspaces/homelab/.local/auth-certs/ca.crt"
client_certificate = "/workspaces/homelab/.local/auth-certs/oliver_labiraus.com.crt"
client_private_key = "/workspaces/homelab/.local/auth-certs/oliver_labiraus.com.key"
