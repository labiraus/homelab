---
- name: Restart SeaweedFS
  ansible.builtin.systemd:
    name: seaweedfs
    daemon_reload: true
    state: restarted

- name: Stop SeaweedFS S3 proxy
  listen: Restart SeaweedFS S3 proxy
  ansible.builtin.systemd:
    name: seaweedfs-s3-proxy.service
    state: stopped
    daemon_reload: true

- name: Restart SeaweedFS S3 socket
  listen: Restart SeaweedFS S3 proxy
  ansible.builtin.systemd:
    name: seaweedfs-s3-proxy.socket
    state: restarted
    daemon_reload: true
