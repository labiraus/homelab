seaweedfs_version: "4.48"
seaweedfs_checksums:
  amd64: 4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124
  arm64: 557e92c38c5c7d180748eb8e2b2b45e426f8e5282a4caca8e098a90d09f03a07
seaweedfs_service_user: oliver
seaweedfs_service_group: oliver
seaweedfs_mount: /srv/minio
seaweedfs_volume_dir: /srv/minio/seaweedfs/volumes
# Keep LevelDB metadata on the host's native filesystem, not the NTFS share.
seaweedfs_metadata_dir: /var/lib/seaweedfs
seaweedfs_s3_bind: "{{ ansible_host }}"
seaweedfs_s3_port: 8333
seaweedfs_s3_endpoint: "http://{{ seaweedfs_s3_bind }}:{{ seaweedfs_s3_port }}"
seaweedfs_buckets:
  - velero
  - cnpg-backups
  - documents
  - static-sites-site1
seaweedfs_identities:
  - name: admin
    access_key_env: SEAWEED_ADMIN_ACCESS_KEY
    secret_key_env: SEAWEED_ADMIN_SECRET_KEY
    actions: [Admin, Read, Write, List, Tagging]
  - name: documents
    access_key_env: SEAWEED_DOCUMENTS_ACCESS_KEY
    secret_key_env: SEAWEED_DOCUMENTS_SECRET_KEY
    actions: ["Read:documents", "Write:documents", "List:documents", "Tagging:documents"]
  - name: velero
    access_key_env: SEAWEED_VELERO_ACCESS_KEY
    secret_key_env: SEAWEED_VELERO_SECRET_KEY
    actions: ["Read:velero", "Write:velero", "List:velero", "Tagging:velero"]
  - name: cnpg
    access_key_env: SEAWEED_CNPG_ACCESS_KEY
    secret_key_env: SEAWEED_CNPG_SECRET_KEY
    actions: ["Read:cnpg-backups", "Write:cnpg-backups", "List:cnpg-backups", "Tagging:cnpg-backups"]
  - name: site1
    access_key_env: SEAWEED_SITE1_ACCESS_KEY
    secret_key_env: SEAWEED_SITE1_SECRET_KEY
    actions: ["Read:static-sites-site1", "Write:static-sites-site1", "List:static-sites-site1"]
