---
- name: Ensure kernel modules persist across reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      overlay
      br_netfilter

- name: Load required kernel modules now
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure Kubernetes sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  register: kubernetes_manual_node_sysctl_file

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  when: kubernetes_manual_node_sysctl_file.changed
  changed_when: true

- name: Disable swap for the current boot
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) | int > 0
  changed_when: true

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Stop and disable headless worker UI services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ kubernetes_manual_node_headless_disable_services }}"
  when:
    - kubernetes_manual_node_headless
    - kubernetes_manual_node_headless_disable_services | length > 0

- name: Set the default boot target to multi-user for headless workers
  ansible.builtin.file:
    src: /lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link
    force: true
  when: kubernetes_manual_node_headless

- name: Purge desktop packages from headless workers
  ansible.builtin.apt:
    name: "{{ kubernetes_manual_node_headless_purge_packages }}"
    state: absent
    purge: true
    autoremove: true
  when:
    - kubernetes_manual_node_headless
    - kubernetes_manual_node_headless_purge_packages | length > 0

- name: Install Kubernetes node prerequisite packages
  ansible.builtin.apt:
    name: "{{ kubernetes_manual_node_packages }}"
    state: present
    update_cache: true

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check whether containerd config already exists
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: kubernetes_manual_node_containerd_config

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default >/etc/containerd/config.toml
  when: not kubernetes_manual_node_containerd_config.stat.exists
  changed_when: true

- name: Configure containerd to use systemd cgroups
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup = false$'
    replace: '\1SystemdCgroup = true'
  register: kubernetes_manual_node_containerd_cgroup

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure NVIDIA apt keyring exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg
  register: kubernetes_manual_node_nvidia_keyring
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Check whether NVIDIA container toolkit apt repository already exists
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/nvidia-container-toolkit.list
  register: kubernetes_manual_node_nvidia_repo
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Install NVIDIA container toolkit signing key
  ansible.builtin.shell: >-
    curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey
    | gpg --dearmor -o /etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg
  when:
    - kubernetes_manual_node_enable_nvidia_gpu
    - not kubernetes_manual_node_nvidia_keyring.stat.exists
  changed_when: true

- name: Configure NVIDIA container toolkit apt repository
  ansible.builtin.shell: >-
    curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list
    | sed 's#deb https://#deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g'
    > /etc/apt/sources.list.d/nvidia-container-toolkit.list
  when:
    - kubernetes_manual_node_enable_nvidia_gpu
    - not kubernetes_manual_node_nvidia_repo.stat.exists
  changed_when: true

- name: Install NVIDIA container toolkit packages
  ansible.builtin.apt:
    name: "{{ kubernetes_manual_node_nvidia_container_toolkit_packages }}"
    state: present
    update_cache: true
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Configure containerd default runtime for NVIDIA
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)default_runtime_name = "runc"$'
    replace: '\1default_runtime_name = "{{ kubernetes_manual_node_nvidia_runtime_class_name }}"'
  register: kubernetes_manual_node_nvidia_default_runtime
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Configure NVIDIA runtime in containerd
  ansible.builtin.blockinfile:
    path: /etc/containerd/config.toml
    marker: "# {mark} ANSIBLE MANAGED NVIDIA RUNTIME"
    block: |
      [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.{{ kubernetes_manual_node_nvidia_runtime_class_name }}]
        privileged_without_host_devices = false
        runtime_type = "io.containerd.runc.v2"
        [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.{{ kubernetes_manual_node_nvidia_runtime_class_name }}.options]
          BinaryName = "/usr/bin/nvidia-container-runtime"
          SystemdCgroup = true
  register: kubernetes_manual_node_nvidia_runtime_block
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Ensure containerd service is enabled and started
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started

- name: Restart containerd when config changes
  ansible.builtin.systemd_service:
    name: containerd
    state: restarted
  when:
    - kubernetes_manual_node_containerd_cgroup.changed
      or (kubernetes_manual_node_nvidia_default_runtime is defined and kubernetes_manual_node_nvidia_default_runtime.changed)
      or (kubernetes_manual_node_nvidia_runtime_block is defined and kubernetes_manual_node_nvidia_runtime_block.changed)

- name: Check whether Kubernetes apt keyring already exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  register: kubernetes_manual_node_keyring

- name: Install Kubernetes apt signing key
  ansible.builtin.shell: >-
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubernetes_manual_node_kube_minor_channel }}/deb/Release.key
    | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: not kubernetes_manual_node_keyring.stat.exists
  changed_when: true

- name: Ensure Kubernetes apt keyring permissions are correct
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    owner: root
    group: root
    mode: "0644"

- name: Configure Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    owner: root
    group: root
    mode: "0644"
    content: >-
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
      https://pkgs.k8s.io/core:/stable:/{{ kubernetes_manual_node_kube_minor_channel }}/deb/ /

- name: Install Kubernetes packages
  ansible.builtin.apt:
    name: "{{ kubernetes_manual_node_kubernetes_packages }}"
    state: present
    update_cache: true

- name: Hold Kubernetes packages at the installed version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_manual_node_kubernetes_packages }}"

- name: Ensure kubelet service is enabled and started
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
    state: started

- name: Restart kubelet when NVIDIA runtime changes
  ansible.builtin.systemd_service:
    name: kubelet
    state: restarted
  when:
    - kubernetes_manual_node_enable_nvidia_gpu
    - kubernetes_manual_node_nvidia_default_runtime.changed
      or kubernetes_manual_node_nvidia_runtime_block.changed

- name: Check whether the node is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubernetes_manual_node_kubelet_conf

- name: Fetch a fresh kubeadm join command from the control plane
  ansible.builtin.command: ssh {{ kubernetes_manual_node_control_plane_host }} kubeadm token create --print-join-command
  delegate_to: localhost
  become: false
  register: kubernetes_manual_node_join_command
  changed_when: false
  when: not kubernetes_manual_node_kubelet_conf.stat.exists
  no_log: true

- name: Join the node to the cluster
  ansible.builtin.command: "{{ kubernetes_manual_node_join_command.stdout }}"
  when: not kubernetes_manual_node_kubelet_conf.stat.exists
  no_log: true

- name: Render NVIDIA RuntimeClass manifest locally
  ansible.builtin.template:
    src: nvidia-runtimeclass.yaml.j2
    dest: /tmp/kubernetes-manual-node-nvidia-runtimeclass.yaml
    mode: "0644"
  delegate_to: localhost
  become: false
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Apply NVIDIA RuntimeClass
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - /tmp/kubernetes-manual-node-nvidia-runtimeclass.yaml
  delegate_to: localhost
  become: false
  changed_when: false
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Label NVIDIA device-plugin node selector on the Kubernetes node
  ansible.builtin.command:
    argv:
      - kubectl
      - label
      - node
      - "{{ kubernetes_manual_node_kubernetes_node_name }}"
      - "{{ kubernetes_manual_node_nvidia_selector_label_key }}={{ kubernetes_manual_node_nvidia_selector_label_value }}"
      - --overwrite
  delegate_to: localhost
  become: false
  changed_when: false
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Apply GPU capability labels to the Kubernetes node
  ansible.builtin.command:
    argv:
      - kubectl
      - label
      - node
      - "{{ kubernetes_manual_node_kubernetes_node_name }}"
      - "{{ item.key }}={{ item.value }}"
      - --overwrite
  loop: "{{ kubernetes_manual_node_gpu_labels | dict2items }}"
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - kubernetes_manual_node_enable_nvidia_gpu
    - kubernetes_manual_node_gpu_labels | length > 0

- name: Render NVIDIA device plugin manifest locally
  ansible.builtin.template:
    src: nvidia-device-plugin.yaml.j2
    dest: /tmp/kubernetes-manual-node-nvidia-device-plugin.yaml
    mode: "0644"
  delegate_to: localhost
  become: false
  when: kubernetes_manual_node_enable_nvidia_gpu

- name: Apply NVIDIA device plugin
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - -f
      - /tmp/kubernetes-manual-node-nvidia-device-plugin.yaml
  delegate_to: localhost
  become: false
  changed_when: false
  when: kubernetes_manual_node_enable_nvidia_gpu
