---
- name: Require active Minecraft server to exist
  ansible.builtin.assert:
    that:
      - minecraft_vm_active_server in minecraft_vm_servers
    fail_msg: >-
      minecraft_vm_active_server={{ minecraft_vm_active_server }} is not defined in
      minecraft_vm_servers.

- name: Require supported Minecraft profile start modes
  ansible.builtin.assert:
    that:
      - (item.value.start_mode | default('bootstrap')) in minecraft_vm_supported_start_modes
    fail_msg: >-
      start_mode={{ item.value.start_mode | default('bootstrap') }} for Minecraft profile
      {{ item.key }} is unsupported. Expected one of
      {{ minecraft_vm_supported_start_modes | join(', ') }}.
  loop: "{{ minecraft_vm_servers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Require legacy Minecraft migration target to exist
  ansible.builtin.assert:
    that:
      - minecraft_vm_legacy_server_name in minecraft_vm_servers
    fail_msg: >-
      minecraft_vm_legacy_server_name={{ minecraft_vm_legacy_server_name }} is not defined in
      minecraft_vm_servers.

- name: Resolve CurseForge API key from environment
  ansible.builtin.set_fact:
    minecraft_vm_curseforge_api_key: "{{ lookup('ansible.builtin.env', minecraft_vm_curseforge_api_key_env) }}"
  no_log: true

- name: Resolve Minecraft RCON password from environment
  ansible.builtin.set_fact:
    minecraft_vm_rcon_password: "{{ lookup('ansible.builtin.env', minecraft_vm_rcon_password_env) }}"
  no_log: true

- name: Require Minecraft RCON password
  ansible.builtin.assert:
    that:
      - minecraft_vm_rcon_password | length > 0
    fail_msg: >-
      {{ minecraft_vm_rcon_password_env }} must be set in the environment or ansible/.env so
      Ansible can enable RCON for Minecraft server commands.

- name: Identify AUTO_CURSEFORGE Minecraft profiles
  ansible.builtin.set_fact:
    minecraft_vm_auto_curseforge_servers: >-
      {{
        minecraft_vm_servers
        | dict2items
        | selectattr('value.runtime_env.MOD_PLATFORM', 'defined')
        | selectattr('value.runtime_env.MOD_PLATFORM', 'equalto', 'AUTO_CURSEFORGE')
        | map(attribute='key')
        | list
      }}

- name: Require CurseForge API key when AUTO_CURSEFORGE is enabled
  ansible.builtin.assert:
    that:
      - minecraft_vm_auto_curseforge_servers | length == 0 or (minecraft_vm_curseforge_api_key | length > 0)
    fail_msg: >-
      MINECRAFT_CURSEFORGE_API_KEY must be set in the environment or ansible/.env when
      minecraft_vm_servers uses AUTO_CURSEFORGE.

- name: Install Minecraft VM packages
  ansible.builtin.apt:
    name: "{{ minecraft_vm_packages }}"
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Ensure Minecraft upload user can access Docker
  ansible.builtin.user:
    name: "{{ minecraft_vm_upload_user }}"
    groups: docker
    append: true

- name: Ensure Minecraft root directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "{{ minecraft_vm_dir_mode }}"
  loop:
    - "{{ minecraft_vm_root }}"
    - "{{ minecraft_vm_servers_root }}"

- name: Ensure per-server parent directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "{{ minecraft_vm_dir_mode }}"
  loop: >-
    {{
      (
        (
          minecraft_vm_servers
          | dict2items
          | map(attribute='value.data_dir')
          | map('dirname')
          | list
        )
        +
        (
          minecraft_vm_servers
          | dict2items
          | map(attribute='value.backup_dir')
          | map('dirname')
          | list
        )
      )
      | unique
    }}

- name: Ensure Minecraft config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ minecraft_vm_etc_dir }}"
    - "{{ minecraft_vm_servers_config_dir }}"

- name: Check legacy single-server data directory
  ansible.builtin.stat:
    path: "{{ minecraft_vm_legacy_data_dir }}"
    follow: false
  register: minecraft_vm_legacy_data_dir_stat

- name: Check legacy single-server backup directory
  ansible.builtin.stat:
    path: "{{ minecraft_vm_legacy_backup_dir }}"
    follow: false
  register: minecraft_vm_legacy_backup_dir_stat

- name: Check migrated legacy data target
  ansible.builtin.stat:
    path: "{{ minecraft_vm_servers[minecraft_vm_legacy_server_name].data_dir }}"
    follow: false
  register: minecraft_vm_legacy_target_data_dir_stat

- name: Check migrated legacy backup target
  ansible.builtin.stat:
    path: "{{ minecraft_vm_servers[minecraft_vm_legacy_server_name].backup_dir }}"
    follow: false
  register: minecraft_vm_legacy_target_backup_dir_stat

- name: Refuse conflicting legacy data migration state
  ansible.builtin.assert:
    that:
      - >-
        not (
          minecraft_vm_legacy_data_dir_stat.stat.exists
          and not (minecraft_vm_legacy_data_dir_stat.stat.islnk | default(false))
          and minecraft_vm_legacy_target_data_dir_stat.stat.exists
        )
    fail_msg: >-
      Both legacy Minecraft data directory {{ minecraft_vm_legacy_data_dir }} and migrated target
      {{ minecraft_vm_servers[minecraft_vm_legacy_server_name].data_dir }} exist. Resolve this
      manually before rerunning the playbook to avoid overwriting data.

- name: Refuse conflicting legacy backup migration state
  ansible.builtin.assert:
    that:
      - >-
        not (
          minecraft_vm_legacy_backup_dir_stat.stat.exists
          and not (minecraft_vm_legacy_backup_dir_stat.stat.islnk | default(false))
          and minecraft_vm_legacy_target_backup_dir_stat.stat.exists
        )
    fail_msg: >-
      Both legacy Minecraft backup directory {{ minecraft_vm_legacy_backup_dir }} and migrated
      target {{ minecraft_vm_servers[minecraft_vm_legacy_server_name].backup_dir }} exist.
      Resolve this manually before rerunning the playbook to avoid overwriting data.

- name: Migrate legacy Minecraft data directory into profile storage
  ansible.builtin.command:
    argv:
      - mv
      - "{{ minecraft_vm_legacy_data_dir }}"
      - "{{ minecraft_vm_servers[minecraft_vm_legacy_server_name].data_dir }}"
  when:
    - minecraft_vm_legacy_data_dir_stat.stat.exists
    - not (minecraft_vm_legacy_data_dir_stat.stat.islnk | default(false))
    - not minecraft_vm_legacy_target_data_dir_stat.stat.exists

- name: Migrate legacy Minecraft backup directory into profile storage
  ansible.builtin.command:
    argv:
      - mv
      - "{{ minecraft_vm_legacy_backup_dir }}"
      - "{{ minecraft_vm_servers[minecraft_vm_legacy_server_name].backup_dir }}"
  when:
    - minecraft_vm_legacy_backup_dir_stat.stat.exists
    - not (minecraft_vm_legacy_backup_dir_stat.stat.islnk | default(false))
    - not minecraft_vm_legacy_target_backup_dir_stat.stat.exists

- name: Ensure per-server Minecraft data directories exist
  ansible.builtin.file:
    path: "{{ item.value.data_dir }}"
    state: directory
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "{{ minecraft_vm_dir_mode }}"
  loop: "{{ minecraft_vm_servers | dict2items }}"

- name: Ensure per-server Minecraft backup directories exist
  ansible.builtin.file:
    path: "{{ item.value.backup_dir }}"
    state: directory
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "{{ minecraft_vm_dir_mode }}"
  loop: "{{ minecraft_vm_servers | dict2items }}"

- name: Render per-server Minecraft environment files
  ansible.builtin.template:
    src: minecraft.env.j2
    dest: "{{ minecraft_vm_servers_config_dir }}/{{ item.key }}.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ minecraft_vm_servers | dict2items }}"
  vars:
    minecraft_vm_server_name: "{{ item.key }}"
    minecraft_vm_server: "{{ item.value }}"
  notify: Restart minecraft

- name: Render per-server Minecraft runtime metadata files
  ansible.builtin.template:
    src: minecraft.runtime.env.j2
    dest: "{{ minecraft_vm_servers_config_dir }}/{{ item.key }}.runtime.env"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ minecraft_vm_servers | dict2items }}"
  vars:
    minecraft_vm_server_name: "{{ item.key }}"
    minecraft_vm_server: "{{ item.value }}"
  notify: Restart minecraft

- name: Check preinstalled AUTO_CURSEFORGE profile state
  ansible.builtin.shell: |
    set -euo pipefail
    data_dir={{ item.value.data_dir | quote }}
    expected_pack={{ item.value.runtime_env.CF_FILENAME_MATCHER | quote }}
    expected_loader={{ item.value.runtime_env.NEOFORGE_VERSION | quote }}
    loader_setup_version={{ item.value.loader_setup_version | default('') | quote }}
    run_sh="${data_dir}/run.sh"
    manifest="${data_dir}/.curseforge-manifest.json"

    actual_run="$(
      sed -n 's#.*libraries/net/neoforged/neoforge/\([^/]*\)/unix_args.txt.*#\1#p' "${run_sh}" \
      | head -n1
    )"
    actual_pack="$(
      sed -n 's/.*"modpackVersion":"\([^"]*\)".*/\1/p' "${manifest}" \
      | head -n1
    )"
    actual_loader="$(
      sed -n 's/.*"modLoaderId":"neoforge-\([^"]*\)".*/\1/p' "${manifest}" \
      | head -n1
    )"

    test "${actual_run}" = "${expected_loader}" \
      && [[ "${actual_pack}" == "${expected_pack}"* ]] \
      && { test -n "${loader_setup_version}" || test "${actual_loader}" = "${expected_loader}"; }
  args:
    executable: /bin/bash
  register: minecraft_vm_preinstalled_profile_state
  changed_when: false
  failed_when: false
  loop: "{{ minecraft_vm_servers | dict2items }}"
  when:
    - item.value.start_mode | default('bootstrap') == 'preinstalled_run_script'
    - item.value.runtime_env.MOD_PLATFORM | default('') == 'AUTO_CURSEFORGE'
    - item.value.runtime_env.CF_FILENAME_MATCHER is defined
    - item.value.runtime_env.NEOFORGE_VERSION is defined

- name: Ensure drifted preinstalled AUTO_CURSEFORGE data is writable before refresh
  ansible.builtin.file:
    path: "{{ item.item.value.data_dir }}"
    state: directory
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    follow: false
    recurse: true
  loop: "{{ minecraft_vm_preinstalled_profile_state.results | default([]) }}"
  when:
    - item.rc is defined
    - item.rc != 0

- name: Refresh preinstalled AUTO_CURSEFORGE profile files when pinned version drifts
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --name
      - "minecraft-{{ item.item.key }}-setup"
      - --env-file
      - "{{ minecraft_vm_servers_config_dir }}/{{ item.item.key }}.env"
      - -e
      - SETUP_ONLY=true
      - -e
      - CF_FORCE_SYNCHRONIZE=true
      - -e
      - CF_FORCE_REINSTALL_MODLOADER=true
      - -v
      - "{{ item.item.value.data_dir }}:/data"
      - -v
      - "{{ item.item.value.backup_dir }}:/backups"
      - "{{ item.item.value.image | default(minecraft_vm_image_default) }}"
  register: minecraft_vm_preinstalled_profile_refresh
  until: minecraft_vm_preinstalled_profile_refresh.rc == 0
  retries: "{{ minecraft_vm_curseforge_refresh_retries | int }}"
  delay: "{{ minecraft_vm_curseforge_refresh_delay_seconds | int }}"
  loop: "{{ minecraft_vm_preinstalled_profile_state.results | default([]) }}"
  when:
    - item.rc is defined
    - item.rc != 0
  notify: Restart minecraft

- name: Refresh pinned NeoForge loader after AUTO_CURSEFORGE refresh
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --name
      - "minecraft-{{ item.item.key }}-neoforge-setup"
      - -e
      - EULA=TRUE
      - -e
      - TYPE=NEOFORGE
      - -e
      - "VERSION={{ item.item.value.loader_setup_version }}"
      - -e
      - "NEOFORGE_VERSION={{ item.item.value.runtime_env.NEOFORGE_VERSION }}"
      - -e
      - SETUP_ONLY=true
      - -v
      - "{{ item.item.value.data_dir }}:/data"
      - -v
      - "{{ item.item.value.backup_dir }}:/backups"
      - "{{ item.item.value.image | default(minecraft_vm_image_default) }}"
  register: minecraft_vm_neoforge_loader_refresh
  until: minecraft_vm_neoforge_loader_refresh.rc == 0
  retries: "{{ minecraft_vm_curseforge_refresh_retries | int }}"
  delay: "{{ minecraft_vm_curseforge_refresh_delay_seconds | int }}"
  loop: "{{ minecraft_vm_preinstalled_profile_state.results | default([]) }}"
  when:
    - item.rc is defined
    - item.rc != 0
    - item.item.value.loader_setup_version is defined
    - item.item.value.runtime_env.NEOFORGE_VERSION is defined
  notify: Restart minecraft

- name: Point preinstalled Minecraft run scripts at the pinned NeoForge loader
  ansible.builtin.replace:
    path: "{{ item.value.data_dir }}/run.sh"
    regexp: '(@libraries/net/neoforged/neoforge/)[^/]+(/unix_args\\.txt)'
    replace: '\\g<1>{{ item.value.runtime_env.NEOFORGE_VERSION }}\\g<2>'
  loop: "{{ minecraft_vm_servers | dict2items }}"
  when:
    - item.value.start_mode | default('bootstrap') == 'preinstalled_run_script'
    - item.value.runtime_env.NEOFORGE_VERSION is defined
  notify: Restart minecraft

- name: Manage preinstalled Minecraft JVM heap arguments
  ansible.builtin.copy:
    dest: "{{ item.value.data_dir }}/user_jvm_args.txt"
    content: |
      -Xms{{ item.value.runtime_env.INIT_MEMORY | default(item.value.runtime_env.MEMORY) }}
      -Xmx{{ item.value.runtime_env.MEMORY }}
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "0644"
  loop: "{{ minecraft_vm_servers | dict2items }}"
  when:
    - item.value.start_mode | default('bootstrap') == 'preinstalled_run_script'
    - item.value.runtime_env.MEMORY is defined
  notify: Restart minecraft

- name: Find per-server removed mod jars
  ansible.builtin.find:
    paths: "{{ item.0.value.data_dir }}/mods"
    patterns: "{{ item.1 }}"
    file_type: file
  register: minecraft_vm_removed_mod_jars
  loop: "{{ minecraft_vm_servers | dict2items | subelements('value.remove_mod_globs', skip_missing=True) }}"

- name: Remove per-server replaced mod jars
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ minecraft_vm_removed_mod_jars.results | default([]) | map(attribute='files') | flatten }}"
  notify: Restart minecraft

- name: Ensure per-server extra mods are installed
  ansible.builtin.get_url:
    url: "{{ item.1.url }}"
    dest: "{{ item.0.value.data_dir }}/mods/{{ item.1.filename }}"
    checksum: "{{ item.1.checksum | default(omit) }}"
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "0644"
  loop: "{{ minecraft_vm_servers | dict2items | subelements('value.extra_mods', skip_missing=True) }}"
  notify: Restart minecraft

- name: Ensure per-server extra config parent directories exist
  ansible.builtin.file:
    path: "{{ item.0.value.data_dir }}/{{ item.1.path | dirname }}"
    state: directory
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "0775"
  loop: "{{ minecraft_vm_servers | dict2items | subelements('value.extra_config_files', skip_missing=True) }}"

- name: Ensure per-server extra config files are installed
  ansible.builtin.copy:
    dest: "{{ item.0.value.data_dir }}/{{ item.1.path }}"
    content: "{{ item.1.content | to_nice_json }}\n"
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "0644"
  loop: "{{ minecraft_vm_servers | dict2items | subelements('value.extra_config_files', skip_missing=True) }}"
  notify: Restart minecraft

- name: Render Minecraft switch helper
  ansible.builtin.template:
    src: minecraft-switch.j2
    dest: "{{ minecraft_vm_switch_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Render Minecraft profile-aware launcher
  ansible.builtin.template:
    src: minecraft-launch.j2
    dest: "{{ minecraft_vm_launcher_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart minecraft

- name: Record repo-authoritative active Minecraft server
  ansible.builtin.copy:
    content: "{{ minecraft_vm_active_server }}\n"
    dest: "{{ minecraft_vm_active_server_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Point active Minecraft environment link
  ansible.builtin.file:
    src: "{{ minecraft_vm_servers_config_dir }}/{{ minecraft_vm_active_server }}.env"
    path: "{{ minecraft_vm_active_env_link }}"
    state: link
    force: true
  notify: Restart minecraft

- name: Point active Minecraft runtime metadata link
  ansible.builtin.file:
    src: "{{ minecraft_vm_servers_config_dir }}/{{ minecraft_vm_active_server }}.runtime.env"
    path: "{{ minecraft_vm_active_runtime_link }}"
    state: link
    force: true
  notify: Restart minecraft

- name: Point active Minecraft data link
  ansible.builtin.file:
    src: "{{ minecraft_vm_servers[minecraft_vm_active_server].data_dir }}"
    path: "{{ minecraft_vm_legacy_data_dir }}"
    state: link
    force: true
  notify: Restart minecraft

- name: Point active Minecraft backup link
  ansible.builtin.file:
    src: "{{ minecraft_vm_servers[minecraft_vm_active_server].backup_dir }}"
    path: "{{ minecraft_vm_legacy_backup_dir }}"
    state: link
    force: true
  notify: Restart minecraft

- name: Render Minecraft systemd service
  ansible.builtin.template:
    src: minecraft.service.j2
    dest: "/etc/systemd/system/{{ minecraft_vm_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart minecraft

- name: Ensure Minecraft service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ minecraft_vm_service_name }}"
    enabled: true
    state: started

- name: Apply pending Minecraft restarts before server tuning
  ansible.builtin.meta: flush_handlers

- name: Wait for Minecraft server.properties to exist
  ansible.builtin.wait_for:
    path: "{{ minecraft_vm_servers[minecraft_vm_active_server].data_dir }}/server.properties"
    state: present
    timeout: "{{ minecraft_vm_server_properties_wait_timeout }}"

- name: Manage initialized Minecraft profile server.properties overrides
  ansible.builtin.include_tasks: server-properties.yml
  loop: "{{ minecraft_vm_servers | dict2items }}"
  loop_control:
    loop_var: minecraft_vm_server_profile
    label: "{{ minecraft_vm_server_profile.key }}"

- name: Apply final Minecraft restart after server.properties changes
  ansible.builtin.meta: flush_handlers
