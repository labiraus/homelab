---
- name: Resolve CurseForge API key from environment
  ansible.builtin.set_fact:
    minecraft_vm_curseforge_api_key: "{{ lookup('ansible.builtin.env', minecraft_vm_curseforge_api_key_env) }}"
  no_log: true

- name: Require CurseForge API key when AUTO_CURSEFORGE is enabled
  ansible.builtin.assert:
    that:
      - minecraft_vm_mod_platform != "AUTO_CURSEFORGE" or (minecraft_vm_curseforge_api_key | length > 0)
    fail_msg: >-
      MINECRAFT_CURSEFORGE_API_KEY must be set in the environment or ansible/.env when
      minecraft_vm_mod_platform is AUTO_CURSEFORGE.
  no_log: true

- name: Install Minecraft VM packages
  ansible.builtin.apt:
    name: "{{ minecraft_vm_packages }}"
    state: present
    update_cache: true

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Ensure Minecraft directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ minecraft_vm_dir_owner }}"
    group: "{{ minecraft_vm_dir_group }}"
    mode: "{{ minecraft_vm_dir_mode }}"
  loop: "{{ minecraft_vm_dirs }}"

- name: Ensure Minecraft config directory exists
  ansible.builtin.file:
    path: /etc/minecraft
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Minecraft environment file
  ansible.builtin.template:
    src: minecraft.env.j2
    dest: /etc/minecraft/minecraft.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart minecraft

- name: Render Minecraft systemd service
  ansible.builtin.template:
    src: minecraft.service.j2
    dest: "/etc/systemd/system/{{ minecraft_vm_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart minecraft

- name: Ensure Minecraft service is enabled and started
  ansible.builtin.systemd_service:
    name: "{{ minecraft_vm_service_name }}"
    enabled: true
    state: started

- name: Wait for Minecraft server.properties to exist
  ansible.builtin.wait_for:
    path: "{{ minecraft_vm_data_dir }}/server.properties"
    state: present
    timeout: 900

- name: Manage Minecraft server.properties overrides
  ansible.builtin.lineinfile:
    path: "{{ minecraft_vm_data_dir }}/server.properties"
    regexp: "^{{ item.key | regex_escape }}="
    line: "{{ item.key }}={{ item.value }}"
  loop: "{{ minecraft_vm_server_properties | dict2items }}"
  notify: Restart minecraft
