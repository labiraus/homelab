minecraft_vm_service_name: minecraft
minecraft_vm_container_name: minecraft
minecraft_vm_root: /srv/minecraft
minecraft_vm_servers_root: "{{ minecraft_vm_root }}/servers"
minecraft_vm_upload_user: ubuntu
minecraft_vm_port: 25565
minecraft_vm_image_default: "itzg/minecraft-server:java21"
minecraft_vm_curseforge_api_key_env: MINECRAFT_CURSEFORGE_API_KEY

minecraft_vm_common_runtime_env: &minecraft_vm_common_runtime_env
  EULA: "TRUE"
  MEMORY: 10G
  INIT_MEMORY: 2G
  TZ: UTC
  TYPE: NEOFORGE
  VERSION: "1.21.1"
  MOD_PLATFORM: AUTO_CURSEFORGE

minecraft_vm_active_server: atm11

minecraft_vm_servers:
  atm10_tts:
    data_dir: "{{ minecraft_vm_servers_root }}/atm10_tts/data"
    backup_dir: "{{ minecraft_vm_servers_root }}/atm10_tts/backups"
    runtime_env:
      <<: *minecraft_vm_common_runtime_env
      CF_SLUG: all-the-mods-10-sky
      CF_FILENAME_MATCHER: "2.0.2"
  atm11:
    data_dir: "{{ minecraft_vm_servers_root }}/atm11/data"
    backup_dir: "{{ minecraft_vm_servers_root }}/atm11/backups"
    image: "itzg/minecraft-server:java25"
    start_mode: preinstalled_run_script
    loader_setup_version: "26.1.2"
    remove_mod_globs:
      - "evilcraft-26.1.2-neoforge-1.2.96-*.jar"
    extra_mods:
      - filename: connectivity-26.1-7.6.jar
        url: "https://mediafilez.forgecdn.net/files/7866/655/connectivity-26.1-7.6.jar"
        checksum: "sha256:5fe2eba7e56ed273907f2eba5050b5b819e3288ab8036158a5661371e43e1725"
      - filename: evilcraft-26.1.2-neoforge-1.2.97.jar
        url: "https://cdn.modrinth.com/data/3ANq2btA/versions/di3DOOqU/evilcraft-26.1.2-neoforge-1.2.97.jar"
        checksum: "sha512:bd93f9f314c3defd636ff66cc93e3a0e06ad3b77669e250ca5c8ff675bfc036129888793ef2707348e82ce608e46f6dee750145f7f79f807bae6f357dc638044"
    extra_config_files:
      - path: config/connectivity.json
        content:
          disableLoginLimits:
            "desc:": "Should login packet size limits be disabled? Error:(IOException(\"Payload may not be larger than 1048576 bytes\")) default:true"
            disableLoginLimits: true
          disablePacketLimits:
            "desc:": "Should play packet size limits be disabled? Error:(Badly compressed packet) default:true"
            disablePacketLimits: true
          disableChatVerificationDisconnect:
            "desc:": "(Clientside) Disables players disconnecting on chat message verification problems,(enable debugPrintMessages to see the message causing issues). default:true"
            disableChatVerificationDisconnect: true
          debugPrintMessages:
            "desc:": "Enable addition debug logging for networking errors. default:false"
            debugPrintMessages: true
          logintimeout:
            "desc:": "Set the max login timeout in seconds. default = 120"
            logintimeout: 240
          disconnectTimeout:
            "desc:": "Set the ingame disconnect timeout for disconnecting players. Default = 60sec"
            disconnectTimeout: 180
          packetHistoryMinutes:
            "desc:": "Set the amount of minutes for which network packet history data is saved. Default = 5 minutes"
            packetHistoryMinutes: 5
          malformedtraffic:
            "desc:": "Detection and blocking of malformed and/or malicious traffic"
            enabled: true
            "proxies:": "Add your proxy IP to the whitelist below, if you're using one(e.g. velocity) to avoid blocking the proxy's ip. Format: [\"127.0.0.1\", \"128.0.01\"] without the \\ "
            proxywhitelist: []
    runtime_env:
      <<: *minecraft_vm_common_runtime_env
      CF_SLUG: all-the-mods-11
      CF_FILENAME_MATCHER: "0.1.0"
      CF_EXCLUDE_MODS: evilcraft
      NEOFORGE_VERSION: "26.1.2.75"
